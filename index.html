<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icon.png">
  <title>やさい かんさつ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --theme-bg: #fef2f2;
      --theme-text-dark: #b91c1c;
      --theme-text-main: #ef4444;
      --theme-border-light: #fecaca;
      --theme-border-medium: #f87171;
      --theme-border-main: #ef4444;
      --theme-header-bg: #ef4444;
      --theme-header-btn: #dc2626;
    }
    body {
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      overscroll-behavior: none;
      font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN W4", sans-serif;
      overflow: hidden;
      background-color: var(--theme-bg);
    }
    .scrollable { overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .btn-3d {
      box-shadow: 0 6px 0 rgba(0,0,0,0.15);
      transition: all 0.1s;
    }
    .btn-3d:active:not(:disabled) {
      box-shadow: 0 0 0 rgba(0,0,0,0);
      transform: translateY(6px);
    }
    /* 称号ポップアップアニメーション */
    @keyframes rankPop {
      0% { transform: scale(0.5) rotate(-10deg); opacity: 0; }
      70% { transform: scale(1.1) rotate(5deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .rank-animation {
      animation: rankPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    .confetti-canvas {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 100;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative">

  <!-- 0. 設定画面 -->
  <div id="view-select" class="view hidden scrollable flex flex-col items-center justify-start h-full w-full px-4 py-12">
    <div class="w-full max-w-md bg-white p-8 rounded-[3rem] shadow-md border-4 border-gray-200 mb-8 mt-4">
      <h1 class="text-2xl font-bold text-gray-700 mb-4 text-center">はじめに なまえを<br>おしえてね</h1>
      <input type="text" id="userNameInput" class="w-full rounded-2xl p-4 text-2xl font-bold border-4 border-gray-300 text-center outline-none bg-gray-50" placeholder="なまえを かく">
    </div>
    <h1 class="text-3xl font-bold text-gray-700 mb-6 text-center">どの やさい を<br>そだてる？</h1>
    <div class="flex flex-col md:flex-row gap-4 w-full max-w-4xl px-2">
      <button onclick="selectYasai('tomato')" class="btn-3d bg-red-400 text-white rounded-[3rem] py-8 flex flex-col items-center flex-1">
        <img src="images/tomato_main.png" class="w-24 h-24 mb-4 object-contain">
        <span class="text-3xl font-bold">トマト</span>
      </button>
      <button onclick="selectYasai('nasu')" class="btn-3d bg-purple-400 text-white rounded-[3rem] py-8 flex flex-col items-center flex-1">
        <img src="images/nasu_main.png" class="w-24 h-24 mb-4 object-contain">
        <span class="text-3xl font-bold">ナス</span>
      </button>
      <button onclick="selectYasai('piman')" class="btn-3d bg-green-400 text-white rounded-[3rem] py-8 flex flex-col items-center flex-1">
        <img src="images/piman_main.png" class="w-24 h-24 mb-4 object-contain">
        <span class="text-3xl font-bold">ピーマン</span>
      </button>
    </div>
  </div>

  <!-- 1. ホーム画面 -->
  <div id="view-home" class="view hidden flex flex-col items-center h-full w-full px-4 pt-10">
    <div class="flex items-center gap-3 mb-4">
      <img id="homeIconImg" src="" class="w-16 h-16 object-contain">
      <h1 id="homeTitle" class="text-2xl font-bold leading-tight"></h1>
    </div>
    
    <div class="flex flex-col md:flex-row gap-4 w-full max-w-5xl flex-1 min-h-0 overflow-hidden">
      <div class="flex flex-col gap-4 flex-1">
        <!-- 称号・ステータスエリア -->
        <div class="bg-yellow-50 rounded-3xl p-4 border-4 border-yellow-300 shadow-sm flex flex-col items-center">
          <div class="flex items-center gap-4 w-full justify-center mb-2">
            <div id="currentRankIcon" class="w-16 h-16 bg-white rounded-full p-2 border-2 border-yellow-400">
               <img id="rankImgSmall" src="" class="w-full h-full object-contain">
            </div>
            <div class="text-left">
              <div class="text-sm font-bold text-yellow-700">👑 いまの しょうごう</div>
              <div id="userTitle" class="text-xl font-bold text-orange-600"></div>
            </div>
          </div>
          <div class="w-full bg-yellow-200 rounded-full h-4 overflow-hidden border border-yellow-400">
            <div id="titleProgressBar" class="bg-orange-500 h-full transition-all duration-1000" style="width: 0%"></div>
          </div>
          <div class="flex justify-between w-full px-1 mt-1">
            <span class="text-xs font-bold text-yellow-700 flex items-center gap-1">
               <img src="images/water_stamp.png" class="w-4 h-4 object-contain">
               スタンプ: <span id="totalStampCount">0</span>
            </span>
            <span id="nextTitleHint" class="text-xs font-bold text-yellow-700"></span>
          </div>
        </div>

        <!-- カレンダー -->
        <div class="bg-white rounded-3xl p-3 border-4 border-gray-200 shadow-sm flex-1 min-h-0 flex flex-col">
          <div class="flex justify-between items-center mb-2 bg-gray-50 rounded-xl p-2">
            <button onclick="changeMonth(-1)" class="w-10 h-10 bg-white text-theme-main rounded-full font-bold shadow">◀</button>
            <h2 id="calendarTitle" class="text-xl font-bold"></h2>
            <button onclick="changeMonth(1)" class="w-10 h-10 bg-white text-theme-main rounded-full font-bold shadow">▶</button>
          </div>
          <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center flex-1 overflow-y-auto"></div>
        </div>
      </div>

      <!-- メインボタン -->
      <div class="flex md:flex-col gap-4 w-full md:w-64 pb-8 md:pb-0">
        <button onclick="startCamera()" class="btn-3d bg-orange-400 text-white rounded-[2rem] p-6 text-2xl font-bold flex-1 flex flex-col items-center gap-2">
          <span class="text-5xl">📷</span><span>しゃしん</span>
        </button>
        <button onclick="showView('list')" class="btn-3d bg-green-500 text-white rounded-[2rem] p-6 text-2xl font-bold flex-1 flex flex-col items-center gap-2">
          <span class="text-5xl">📖</span><span>きろく</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 2. カメラ画面 (略) / 3. プレビュー画面 (略) ※前回の構造を維持しつつ、セーブ時の演出を強化 -->
  <!-- ... [Camera and Preview Views from previous code] ... -->
  <div id="view-camera" class="view hidden flex flex-col items-center justify-center h-full w-full bg-black relative">
    <video id="cameraVideo" autoplay playsinline class="w-full h-full object-cover"></video>
    <div class="absolute bottom-12 w-full flex justify-center"><button onclick="takePhoto()" class="w-24 h-24 bg-white rounded-full border-[10px] border-gray-300"></button></div>
  </div>

  <div id="view-preview" class="view hidden scrollable flex flex-col items-center w-full px-4 pt-10 pb-20">
    <h2 class="text-2xl font-bold text-blue-700 mb-4" id="previewDate"></h2>
    <img id="previewImage" src="" class="w-full max-w-md h-64 object-contain rounded-3xl border-4 border-white shadow-lg mb-4">
    
    <!-- カード選択エリア -->
    <div class="w-full max-w-md bg-white p-4 rounded-3xl border-4 border-green-200 mb-4">
      <div id="noticeOptionsGrid" class="grid grid-cols-2 gap-4"></div>
    </div>

    <!-- 水やりボタン -->
    <button id="previewWaterBtn" onclick="toggleWateringInPreview()" class="btn-3d bg-blue-500 text-white rounded-3xl p-4 w-full max-w-md text-2xl font-bold mb-6 flex items-center justify-center gap-3">
      <img src="images/water_stamp.png" class="w-8 h-8 object-contain"> みずを あげたよ！
    </button>

    <button onclick="saveRecord()" class="btn-3d bg-red-500 text-white rounded-3xl p-6 w-full max-w-md text-2xl font-bold">きろくする！</button>
  </div>

  <div id="view-list" class="view hidden flex flex-col h-full w-full bg-gray-100">
    <div class="bg-red-500 p-4 pt-12 flex justify-between items-center text-white">
      <button onclick="showView('home')" class="font-bold">◀ もどる</button>
      <h2 class="text-xl font-bold">これまでの きろく</h2>
      <div class="w-10"></div>
    </div>
    <div id="recordList" class="flex-1 scrollable p-4 flex flex-col gap-6"></div>
  </div>

  <!-- 🏆 称号獲得お祝いモーダル -->
  <div id="modal-levelup" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black bg-opacity-60 backdrop-blur-sm">
    <div class="bg-white rounded-[3rem] p-8 border-8 border-yellow-400 max-w-sm w-full text-center relative overflow-hidden">
      <div class="text-2xl font-bold text-gray-500 mb-2">やったね！！</div>
      <div class="text-3xl font-bold text-orange-600 mb-6">しょうごう ゲット！</div>
      
      <!-- 称号イラスト -->
      <div class="w-48 h-48 mx-auto mb-6 flex items-center justify-center bg-yellow-50 rounded-full border-4 border-yellow-200 rank-animation">
        <img id="modalRankImg" src="" class="w-40 h-40 object-contain">
      </div>
      
      <div id="modalRankName" class="text-3xl font-bold text-blue-700 mb-8 leading-tight"></div>
      
      <button onclick="closeLevelUpModal()" class="btn-3d bg-red-500 text-white text-2xl font-bold px-12 py-4 rounded-full">ありがとう！</button>
      
      <!-- 背景のキラキラ演出用 -->
      <div class="absolute top-0 left-0 w-full h-full pointer-events-none opacity-20 text-4xl">
        <div class="absolute top-4 left-4">✨</div>
        <div class="absolute top-20 right-4">🌟</div>
        <div class="absolute bottom-10 left-10">✨</div>
      </div>
    </div>
  </div>

  <script>
    // 称号データ（画像と名前）
    const RANK_DATA = [
      { min: 0,  name: "はじめての みずやり", img: "images/rank_0.png" },
      { min: 3,  name: "みずやり 1ねんせい", img: "images/rank_1.png" },
      { min: 6,  name: "みずやり たんけんたい", img: "images/rank_2.png" },
      { min: 9,  name: "みずやり ヒーロー", img: "images/rank_3.png" },
      { min: 12, name: "みずやり キャプテン", img: "images/rank_4.png" },
      { min: 17, name: "[YASAI]の おともだち", img: "images/rank_5.png" },
      { min: 22, name: "[YASAI]の はかせ", img: "images/rank_6.png" },
      { min: 27, name: "[YASAI]の まほうつかい", img: "images/rank_7.png" },
      { min: 32, name: "スーパー めいじん", img: "images/rank_8.png" },
      { min: 40, name: "ウルトラ マスター", img: "images/rank_9.png" },
      { min: 50, name: "ミラクル プロ", img: "images/rank_10.png" },
      { min: 60, name: "チャンピオン", img: "images/rank_11.png" },
      { min: 75, name: "たいよう", img: "images/rank_12.png" }
    ];

    let currentYasai = 'tomato';
    let currentUserName = '';
    let isPreviewWatered = false;
    let wateringDays = JSON.parse(localStorage.getItem('watering_days')) || [];
    let currentNoticeIndex = -1;

    // --- 称号管理ロジック ---

    function getRankInfo(count) {
      let current = RANK_DATA[0];
      let next = null;
      for (let i = 0; i < RANK_DATA.length; i++) {
        if (count >= RANK_DATA[i].min) {
          current = RANK_DATA[i];
          next = RANK_DATA[i+1] || null;
        }
      }
      return { current, next };
    }

    function updateStatusUI() {
      const count = wateringDays.length;
      const { current, next } = getRankInfo(count);
      const yasaiName = (currentYasai === 'tomato') ? 'トマト' : (currentYasai === 'nasu' ? 'ナス' : 'ピーマン');
      
      document.getElementById('totalStampCount').innerText = count;
      document.getElementById('userTitle').innerText = current.name.replace('[YASAI]', yasaiName);
      document.getElementById('rankImgSmall').src = current.img;

      const progress = next ? ((count - current.min) / (next.min - current.min)) * 100 : 100;
      document.getElementById('titleProgressBar').style.width = `${progress}%`;
      document.getElementById('nextTitleHint').innerText = next ? `つぎまで あと ${next.min - count}こ` : "さいこうの ランク！";
    }

    function checkLevelUp(oldCount, newCount) {
      const oldRank = getRankInfo(oldCount).current;
      const newRank = getRankInfo(newCount).current;
      
      if (oldRank.min !== newRank.min) {
        showLevelUpModal(newRank);
        return true;
      }
      return false;
    }

    function showLevelUpModal(rank) {
      const yasaiName = (currentYasai === 'tomato') ? 'トマト' : (currentYasai === 'nasu' ? 'ナス' : 'ピーマン');
      document.getElementById('modalRankImg').src = rank.img;
      document.getElementById('modalRankName').innerText = rank.name.replace('[YASAI]', yasaiName);
      document.getElementById('modal-levelup').classList.remove('hidden');
      
      // 紙吹雪（confetti）を飛ばす
      confetti({
        particleCount: 150,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#ff0000', '#ffa500', '#ffff00', '#00ff00', '#0000ff']
      });
    }

    function closeLevelUpModal() {
      document.getElementById('modal-levelup').classList.add('hidden');
    }

    // --- 保存処理 ---

    function saveRecord() {
      const today = new Date().toISOString().split('T')[0]; // YYYY-MM-DD
      const oldCount = wateringDays.length;
      
      if (isPreviewWatered && !wateringDays.includes(today)) {
        wateringDays.push(today);
        localStorage.setItem('watering_days', JSON.stringify(wateringDays));
      }
      
      const newCount = wateringDays.length;
      
      // 保存アニメーションの後に称号チェック
      const isLevelUp = checkLevelUp(oldCount, newCount);
      
      // 既存の保存処理
      let records = JSON.parse(localStorage.getItem('yasai_records')) || [];
      records.push({
        id: Date.now(),
        image: document.getElementById('previewImage').src,
        watered: isPreviewWatered,
        dateText: new Date().toLocaleDateString(),
        userName: currentUserName,
        yasai: currentYasai
      });
      localStorage.setItem('yasai_records', JSON.stringify(records));

      if (!isLevelUp) {
        alert("きろく したよ！");
        showView('home');
      }
    }

    // --- 初期化・View管理など (一部省略、前回のコードと同様に実装) ---
    function selectYasai(type) {
      currentYasai = type;
      currentUserName = document.getElementById('userNameInput').value || 'ななし';
      localStorage.setItem('user_name', currentUserName);
      localStorage.setItem('yasai_type', type);
      showView('home');
    }

    function showView(name) {
      document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
      document.getElementById('view-' + name).classList.remove('hidden');
      if (name === 'home') {
        document.getElementById('homeTitle').innerHTML = `${currentUserName}さんの<br>${(currentYasai==='tomato'?'トマト':(currentYasai==='nasu'?'ナス':'ピーマン'))}の きろく`;
        document.getElementById('homeIconImg').src = `images/${currentYasai}_main.png`;
        updateStatusUI();
        renderCalendar();
      }
    }

    function renderCalendar() {
      // カレンダー描画ロジック (前回同様)
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';
      const now = new Date();
      document.getElementById('calendarTitle').innerText = `${now.getMonth()+1}がつ`;
      for(let i=1; i<=30; i++) {
        const d = document.createElement('div');
        d.className = "aspect-square border flex items-center justify-center relative";
        d.innerText = i;
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
        if (wateringDays.includes(dateStr)) {
          d.innerHTML += `<img src="images/water_stamp.png" class="absolute inset-0 w-full h-full object-contain p-1">`;
        }
        grid.appendChild(d);
      }
    }

    function toggleWateringInPreview() {
      isPreviewWatered = !isPreviewWatered;
      const btn = document.getElementById('previewWaterBtn');
      btn.style.backgroundColor = isPreviewWatered ? '#3b82f6' : '#93c5fd';
    }

    function startCamera() { showView('camera'); }
    function takePhoto() { 
      // 簡易的な写真取得処理
      document.getElementById('previewImage').src = "images/tomato_main.png"; // ダミー
      document.getElementById('previewDate').innerText = "きょうの きろく";
      showView('preview'); 
    }

    window.onload = () => {
      if (localStorage.getItem('user_name')) {
        currentUserName = localStorage.getItem('user_name');
        currentYasai = localStorage.getItem('yasai_type') || 'tomato';
        showView('home');
      } else {
        showView('select');
      }
    };
  </script>
</body>
</html>
