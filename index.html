<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="やさいかんさつ">
  <link rel="apple-touch-icon" href="icon.png">
  
  <title>やさい かんさつ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --theme-bg: #fef2f2;
      --theme-text-dark: #b91c1c;
      --theme-text-main: #ef4444;
      --theme-border-light: #fecaca;
      --theme-border-medium: #f87171;
      --theme-border-main: #ef4444;
      --theme-header-bg: #ef4444;
      --theme-header-btn: #dc2626;
    }
    body {
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      overscroll-behavior: none;
      font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN W4", sans-serif;
      overflow: hidden;
      background-color: var(--theme-bg);
    }
    .scrollable {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .btn-3d {
      box-shadow: 0 6px 0 rgba(0,0,0,0.15);
      transition: all 0.1s;
    }
    .btn-3d:active:not(:disabled) {
      box-shadow: 0 0 0 rgba(0,0,0,0);
      transform: translateY(6px);
    }
    .bg-theme-bg { background-color: var(--theme-bg); }
    .text-theme-dark { color: var(--theme-text-dark); }
    .text-theme-main { color: var(--theme-text-main); }
    .border-theme-light { border-color: var(--theme-border-light); }
    .border-theme-medium { border-color: var(--theme-border-medium); }
    .border-theme-main { border-color: var(--theme-border-main); }
    .bg-theme-header { background-color: var(--theme-header-bg); }
    .bg-theme-btn { background-color: var(--theme-header-btn); }

    @keyframes popIn {
      0% { transform: scale(0.3) rotate(-15deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .animate-pop-in {
      animation: popIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .snap-container {
      scroll-snap-type: y mandatory;
    }
    .snap-item {
      scroll-snap-align: start;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col items-center relative text-gray-800">

  <div id="view-select" class="view hidden scrollable flex flex-col items-center justify-start h-full w-full px-4 py-12">
    <div class="w-full max-w-md mb-8 bg-white p-6 rounded-[3rem] shadow-md border-4 border-gray-200 mt-4">
      <h1 class="text-2xl font-bold text-gray-700 mb-4 text-center">はじめに なまえを おしえてね</h1>
      <input type="text" id="userNameInput" class="w-full rounded-2xl p-4 text-2xl font-bold border-4 border-gray-300 text-center outline-none bg-gray-50" placeholder="なまえをタップして入力">
      <div id="nameError" class="hidden text-red-500 text-xl font-bold text-center mt-2 animate-bounce">なまえを かいてね！</div>
    </div>
    <h1 class="text-3xl font-bold text-gray-700 mb-6 text-center">どの やさい を そだてる？</h1>
    <div class="flex flex-col md:flex-row gap-4 w-full max-w-4xl px-2 pb-10">
      <button onclick="selectYasai('tomato')" class="btn-3d bg-red-400 text-white rounded-[2rem] py-8 flex-1 flex flex-col items-center gap-4">
        <div class="w-24 h-24 md:w-32 md:h-32 bg-white/20 rounded-full p-4"><img src="images/tomato_main.png" alt="トマト" class="w-full h-full object-contain"></div>
        <span class="text-2xl md:text-3xl font-bold">トマト</span>
      </button>
      <button onclick="selectYasai('nasu')" class="btn-3d bg-purple-400 text-white rounded-[2rem] py-8 flex-1 flex flex-col items-center gap-4">
        <div class="w-24 h-24 md:w-32 md:h-32 bg-white/20 rounded-full p-4"><img src="images/nasu_main.png" alt="ナス" class="w-full h-full object-contain"></div>
        <span class="text-2xl md:text-3xl font-bold">ナス</span>
      </button>
      <button onclick="selectYasai('piman')" class="btn-3d bg-green-400 text-white rounded-[2rem] py-8 flex-1 flex flex-col items-center gap-4">
        <div class="w-24 h-24 md:w-32 md:h-32 bg-white/20 rounded-full p-4"><img src="images/piman_main.png" alt="ピーマン" class="w-full h-full object-contain"></div>
        <span class="text-2xl md:text-3xl font-bold">ピーマン</span>
      </button>
    </div>
  </div>

  <div id="view-home" class="view hidden flex flex-col items-center justify-start h-full w-full px-4 pt-10 pb-8 box-border overflow-hidden">
    <div class="flex items-center gap-4 mb-4 shrink-0" oncontextmenu="return false;" ontouchstart="startResetPress(event)" ontouchend="cancelResetPress(event)">
      <img id="homeIconImg" src="" alt="アイコン" class="w-14 h-14 md:w-20 md:h-20 object-contain drop-shadow-md">
      <h1 id="homeTitle" class="text-2xl md:text-4xl font-bold text-theme-dark leading-tight"></h1>
    </div>

    <div class="w-full max-w-5xl flex flex-col flex-1 gap-4 min-h-0">
      <div class="bg-yellow-50 rounded-3xl p-4 border-4 border-yellow-300 shadow-sm flex flex-col md:flex-row items-center gap-4 shrink-0">
        <div class="flex items-center gap-3">
          <button onclick="showLargeRank()" class="w-16 h-16 bg-white rounded-full border-2 border-yellow-300 p-1 flex items-center justify-center active:scale-95 transition-transform">
            <img id="currentRankImg" src="" class="w-full h-full object-contain">
          </button>
          <div>
            <div class="text-xs text-gray-500 font-bold">👑 いまの しょうごう</div>
            <div id="userTitle" class="text-xl font-bold text-orange-500"></div>
          </div>
        </div>
        <div class="flex-1 w-full text-center md:text-left">
          <div class="text-base font-bold text-yellow-800 mb-1">✨ あつめた スタンプ: <span id="totalStampCount" class="text-3xl text-theme-main">0</span> こ</div>
          <div class="w-full bg-yellow-200 rounded-full h-3 overflow-hidden" onclick="addTestStamp()"><div id="titleProgressBar" class="bg-orange-400 h-full" style="width: 0%"></div></div>
        </div>
      </div>

      <div class="bg-white rounded-3xl p-4 border-4 border-theme-light shadow-sm flex flex-col shrink-0">
        <h2 class="text-center font-bold text-xl text-theme-dark mb-2">📅 みずやり</h2>
        <div id="weeklyCalendarGrid" class="grid grid-cols-7 gap-2 w-full"></div>
      </div>

      <div class="flex-1 flex flex-col md:flex-row gap-4 py-2">
        <button onclick="startCamera()" class="btn-3d bg-orange-400 text-white rounded-[2.5rem] flex-1 flex flex-col items-center justify-center gap-3">
          <span class="text-6xl">📷</span>
          <span class="text-2xl md:text-3xl font-bold">しゃしんをとる</span>
        </button>
        <button onclick="showView('list', 'list')" class="btn-3d bg-green-500 text-white rounded-[2.5rem] flex-1 flex flex-col items-center justify-center gap-3">
          <span class="text-6xl">📖</span>
          <span class="text-2xl md:text-3xl font-bold">これまでのきろく</span>
        </button>
      </div>
    </div>
  </div>

  <div id="view-list" class="view hidden flex flex-col h-full w-full">
    <div class="bg-theme-header text-white pt-10 md:pt-14 pb-4 md:pb-6 px-4 md:px-8 flex justify-between items-center shadow-md shrink-0 z-10 relative no-print">
      <button onclick="showView('home', 'back')" class="bg-theme-btn px-4 md:px-6 py-3 md:py-4 rounded-2xl text-xl md:text-2xl font-bold active:opacity-80 transition-colors">◀ もどる</button>
      
      <h2 class="text-2xl md:text-4xl font-bold cursor-pointer" 
          ontouchstart="startSecretPress(event)" 
          ontouchend="cancelSecretPress(event)" 
          ontouchcancel="cancelSecretPress(event)" 
          onmousedown="startSecretPress(event)" 
          onmouseup="cancelSecretPress(event)" 
          onmouseleave="cancelSecretPress(event)" 
          style="touch-action: none; -webkit-user-select: none; user-select: none;">これまでの きろく</h2>
          
      <div class="flex gap-4">
        <button id="batchPdfBtn" onclick="downloadPDF()" class="hidden btn-3d bg-blue-600 px-3 md:px-4 py-2 md:py-3 rounded-xl text-lg md:text-xl font-bold active:bg-blue-700 transition-colors border-2 border-white shadow-sm flex flex-col items-center">
          <span>🖨️ ぜんぶ PDF ほぞん</span>
          <span class="text-xs md:text-sm">(せんせい用)</span>
        </button>
      </div>
    </div>
    
    <div id="recordList" class="scrollable snap-container flex-1 p-4 md:p-8 flex flex-col gap-8 pb-16 md:pb-24 bg-gray-100"></div>
  </div>

  <div id="view-camera" class="view hidden flex flex-col items-center justify-center h-full w-full bg-black relative">
    <video id="cameraVideo" autoplay playsinline class="w-full h-full object-cover"></video>
    <div class="absolute top-10 left-6 z-10">
      <button onclick="stopCamera(); showView('home', 'back')" class="bg-gray-800/70 text-white px-6 py-4 rounded-full text-xl font-bold">◀ やめる</button>
    </div>
    <div class="absolute bottom-12 w-full flex justify-center z-10">
      <button onclick="takePhoto()" class="w-24 h-24 bg-white rounded-full border-[10px] border-gray-300 shadow-2xl"></button>
    </div>
  </div>

  <div id="view-preview" class="view hidden flex flex-col items-center justify-start h-full w-full px-4 pt-12 pb-8 box-border relative overflow-hidden">
    <div class="w-full max-w-5xl text-left mb-4 px-2">
      <h2 id="previewDate" class="text-2xl md:text-4xl font-bold text-blue-700"></h2>
    </div>
    <div class="absolute top-8 right-6 flex gap-2 z-20">
      <button id="tabCardBtn" onclick="switchInputMode('card')" class="btn-3d px-4 py-2 bg-green-500 text-white font-bold rounded-xl text-sm md:text-lg">カードで</button>
      <button id="tabTextBtn" onclick="switchInputMode('text')" class="btn-3d px-4 py-2 bg-gray-200 text-gray-600 font-bold rounded-xl text-sm md:text-lg">じぶんで</button>
    </div>
    <div class="w-full max-w-5xl h-40 md:h-64 shrink-0 bg-gray-100 rounded-3xl shadow-inner flex items-center justify-center overflow-hidden border-4 border-gray-300 mb-6">
      <img id="previewImage" src="" alt="プレビュー" class="max-w-full max-h-full object-contain">
    </div>
    <div class="w-full max-w-5xl flex-1 flex flex-col md:flex-row gap-6 min-h-0 mb-8">
      <div class="flex-[2] flex flex-col relative h-full min-h-0">
        <div id="inputModeCard" class="absolute inset-0 bg-white p-4 rounded-3xl shadow-sm border-4 border-green-200 flex flex-col">
          <label class="block text-xl font-bold text-green-700 mb-2 text-center shrink-0">✏️ いまの ようすは？</label>
          <div class="flex items-center justify-center gap-2 flex-1 min-h-0">
            <button id="prevNoticeBtn" onclick="changeNoticePage(-1)" class="btn-3d bg-green-100 text-green-700 rounded-2xl w-14 h-full text-2xl font-bold">◀</button>
            <div id="noticeOptionsGrid" class="grid grid-cols-2 gap-4 flex-1 h-full min-h-0"></div>
            <button id="nextNoticeBtn" onclick="changeNoticePage(1)" class="btn-3d bg-green-100 text-green-700 rounded-2xl w-14 h-full text-2xl font-bold">▶</button>
          </div>
        </div>
        <div id="inputModeText" class="hidden absolute inset-0 bg-white p-6 rounded-3xl shadow-sm border-4 border-blue-200 flex flex-col">
          <label class="block text-xl font-bold text-blue-700 mb-4 text-center shrink-0">✏️ きづいたことを かこう</label>
          <textarea id="noticeText" class="w-full rounded-2xl p-4 text-2xl border-4 border-gray-200 bg-gray-50 flex-1 resize-none outline-none focus:border-blue-400" placeholder="ここを タップして かいてね"></textarea>
        </div>
      </div>
      <div class="flex-1 bg-blue-50 p-6 rounded-3xl border-4 border-blue-200 flex flex-col items-center justify-center shadow-inner h-full min-h-0">
        <h3 class="text-xl font-bold text-blue-800 mb-4 text-center">💧 みずをあげた？</h3>
        <button id="previewWaterBtn" onclick="toggleWateringInPreview()" class="w-full flex-1 flex flex-col items-center justify-center"></button>
      </div>
    </div>
    <div class="flex gap-6 w-full max-w-5xl shrink-0 mt-auto">
      <button onclick="startCamera()" class="btn-3d bg-gray-400 text-white rounded-[2rem] py-5 text-2xl font-bold flex-1">とりなおす</button>
      <button onclick="saveRecord()" class="btn-3d bg-red-500 text-white rounded-[2rem] py-5 text-2xl font-bold flex-[2]">きろくする</button>
    </div>
  </div>

  <div id="modal-success" class="hidden absolute inset-0 bg-black/40 z-50 flex items-center justify-center p-4"></div>
  <div id="modal-error" class="hidden fixed inset-0 bg-black/60 z-[200] flex items-center justify-center p-4">
    <div class="bg-white rounded-[2rem] p-8 max-w-sm w-full text-center shadow-2xl">
      <div id="errorIcon" class="text-6xl mb-4">⚠️</div>
      <h2 id="errorTitle" class="text-2xl font-bold mb-2 text-red-500">エラー</h2>
      <p id="errorMsg" class="text-lg text-gray-600 mb-6 font-bold"></p>
      <div id="errorButtons">
        <button onclick="document.getElementById('modal-error').classList.add('hidden')" class="w-full btn-3d bg-gray-400 text-white py-4 rounded-full font-bold">とじる</button>
      </div>
    </div>
  </div>

  <div id="modal-levelup" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
    <div class="bg-white rounded-[3rem] p-8 border-[10px] border-yellow-400 max-w-sm w-full text-center shadow-2xl animate-pop-in">
      <h2 class="text-2xl font-bold text-orange-600 mb-4">しょうごう ゲット！</h2>
      <div class="w-40 h-40 mx-auto mb-4 bg-yellow-50 rounded-full border-4 border-white flex items-center justify-center shadow-inner">
        <img id="modalRankImg" src="" class="w-28 h-28 object-contain">
      </div>
      <h3 id="modalRankName" class="text-2xl font-bold text-blue-700 mb-6 leading-tight"></h3>
      <button onclick="closeLevelUpModal()" class="w-full btn-3d bg-red-500 text-white text-xl font-bold py-4 rounded-full">ありがとう！</button>
    </div>
  </div>

  <div id="modal-rank-large" class="hidden fixed inset-0 z-[110] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm" onclick="this.classList.add('hidden')">
    <div class="bg-white rounded-[4rem] p-10 border-[12px] border-yellow-400 max-w-md w-full text-center shadow-2xl animate-pop-in" onclick="event.stopPropagation()">
      <div id="largeRankTitle" class="text-2xl font-bold text-orange-600 mb-6">いまの しょうごう</div>
      <div class="w-64 h-64 mx-auto mb-6 bg-yellow-50 rounded-full border-8 border-white flex items-center justify-center shadow-inner">
        <img id="largeRankImg" src="" class="w-48 h-48 object-contain">
      </div>
      <h3 id="largeRankName" class="text-3xl font-bold text-blue-700 mb-8 leading-tight"></h3>
      <button onclick="document.getElementById('modal-rank-large').classList.add('hidden')" class="w-full btn-3d bg-yellow-500 text-white text-2xl font-bold py-5 rounded-full">とじる</button>
    </div>
  </div>

  <div id="modal-reset" class="hidden absolute inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-[2rem] p-8 flex flex-col gap-4 max-w-lg w-full text-center">
      <h2 class="text-2xl font-bold">先生メニュー</h2>
      <button onclick="goToSelectView()" class="btn-3d bg-orange-500 text-white py-4 rounded-2xl font-bold">なまえ・やさいを選び直す</button>
      <button onclick="executeClear()" class="btn-3d bg-red-500 text-white py-4 rounded-2xl font-bold">データを全部消す</button>
      <button id="testModeBtn" onclick="toggleTestMode()" class="btn-3d bg-purple-500 text-white py-4 rounded-2xl font-bold">テストモード：OFF</button>
      <button onclick="document.getElementById('modal-reset').classList.add('hidden')" class="btn-3d bg-gray-400 text-white py-4 rounded-2xl font-bold">やめる</button>
    </div>
  </div>

  <script>
    const YASAI_DATA = {
      'tomato': { name: 'トマト', img: 'images/tomato_main.png', icon: '🍅', pdfColor: '#ef4444' },
      'nasu': { name: 'ナス', img: 'images/nasu_main.png', icon: '🍆', pdfColor: '#a855f7' },
      'piman': { name: 'ピーマン', img: 'images/piman_main.png', icon: '🫑', pdfColor: '#22c55e' }
    };
    const WATERING_TITLES = [
      { min: 30, name: "でんせつの めいじん", img: "images/rank_13.png" },
      { min: 20, name: "[YASAI] はかせ", img: "images/rank_6.png" },
      { min: 10, name: "みずやり ヒーロー", img: "images/rank_3.png" },
      { min: 3, name: "みずやり たんけんたい", img: "images/rank_2.png" },
      { min: 0, name: "はじめての みずやり", img: "images/rank_0.png" }
    ];
    const NOTICE_OPTIONS = {
      'tomato': [
        { img: 'images/tomato_1.png', shortText: 'なえ', text: 'ちいさな なえを うえました。まだ ちいさいです。おおきくなると いいな。' },
        { img: 'images/tomato_2.png', shortText: 'ギザギザのはっぱ', text: 'はっぱが おおきく なりました。よく みると、はっぱの まわりが ギザギザ しています。' },
        { img: 'images/tomato_3.png', shortText: 'きいろいはな', text: 'きいろい はなが さきました。トマトの はなは きいろいんだね。' },
        { img: 'images/tomato_4.png', shortText: 'あかちゃんの実', text: 'はなが さいた あとに、ちいさな みが できました。いろは まだ みどりいろ です。' },
        { img: 'images/tomato_5.png', shortText: 'みどりの実', text: 'みどりいろの みが、ぐんぐん おおきく なりました。まるい かたちを しています。' },
        { img: 'images/tomato_6.png', shortText: 'あかくなった実', text: 'みどりいろ だった みが、まっかに なりました。おいしそうな トマトの できあがりです。' }
      ],
      'nasu': [
        { img: 'images/nasu_1.png', shortText: 'なえ', text: 'ナスの なえを うえました。よく みると、くきが すこし むらさきいろを しています。' },
        { img: 'images/nasu_2.png', shortText: 'おおきいはっぱ', text: 'はっぱが とても おおきく なりました。さわると すこし ふさふさ しています。' },
        { img: 'images/nasu_3.png', shortText: 'むらさきのはな', text: 'むらさきいろの はなが さきました。まん中に きいろい ところが あります。' },
        { img: 'images/nasu_4.png', shortText: 'あかちゃんの実', text: 'はなの あとに、ちいさな ナスが できました。あかちゃん ナスも むらさきいろ です。' },
        { img: 'images/nasu_5.png', shortText: 'おおきくなった実', text: 'ちいさかった ナスが、ながく おおきく なりました。つやつや しています。' },
        { img: 'images/nasu_6.png', shortText: 'しゅうかく', text: 'とても おおきな ナスに なりました。もう しゅうかく できそうです。' }
      ],
      'piman': [
        { img: 'images/piman_1.png', shortText: 'なえ', text: 'ピーマンの なえを うえました。はっぱの さきが すこし とがっています。' },
        { img: 'images/piman_2.png', shortText: 'つやつやのはっぱ', text: 'はっぱの かずが たくさん ふえました。みどりいろで つやつや しています。' },
        { img: 'images/piman_3.png', shortText: 'しろいはな', text: 'しろい はなが さきました。ピーマンの はなは しろくて かわいいね。' },
        { img: 'images/piman_4.png', shortText: 'あかちゃんの実', text: 'はなの あとに、ちいさな みが できました。もう ピーマンの かたちを しています。' },
        { img: 'images/piman_5.png', shortText: 'おおきくなった実', text: 'ピーマンが おおきく なりました。さわると つるつる しています。' },
        { img: 'images/piman_6.png', shortText: 'ぴかぴかピーマン', text: 'ぴかぴかの ピーマンが できました。りっぱに そだって うれしいな。' }
      ]
    };

    let currentYasai = 'tomato';
    let currentUserName = '';
    let currentImageData = null;
    let isPreviewWatered = false;
    let currentNoticeIndex = -1;
    let noticePage = 0;
    let currentInputMode = 'card';
    let videoStream = null;
    let resetTimer = null;
    let secretPressTimer = null;
    let isTeacherMode = false;
    let isTestMode = false; // ★ テストモード用の変数を追加
    let audioCtx = null;

    function playSound(type) {
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.connect(g); g.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      if(type === 'click') { osc.frequency.setValueAtTime(600, now); g.gain.setValueAtTime(0.1, now); osc.start(); osc.stop(now+0.1); }
      else if(type === 'photo') { osc.frequency.setValueAtTime(1200, now); g.gain.setValueAtTime(0.1, now); osc.start(); osc.stop(now+0.05); }
      else if(type === 'water') { osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(1000, now+0.1); g.gain.setValueAtTime(0.1, now); osc.start(); osc.stop(now+0.1); }
      else if(type === 'success') { osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(1200, now+0.2); g.gain.setValueAtTime(0.1, now); osc.start(); osc.stop(now+0.3); }
    }

    function getFormatDate(date) {
      return `${date.getFullYear()}${String(date.getMonth() + 1).padStart(2, '0')}${String(date.getDate()).padStart(2, '0')}_${String(date.getHours()).padStart(2, '0')}${String(date.getMinutes()).padStart(2, '0')}`;
    }

    window.onload = () => {
      const name = localStorage.getItem('user_name');
      if(name) {
        currentUserName = name;
        currentYasai = localStorage.getItem('yasai_type') || 'tomato';
        setYasaiMode(currentYasai);
        showView('home', false);
      } else {
        showView('select', false);
      }
    };

    function selectYasai(type) {
      const name = document.getElementById('userNameInput').value.trim();
      if(!name) { document.getElementById('nameError').classList.remove('hidden'); return; }
      currentUserName = name;
      currentYasai = type;
      localStorage.setItem('user_name', name);
      localStorage.setItem('yasai_type', type);
      setYasaiMode(type);
      showView('home', 'click');
    }

    function setYasaiMode(type) {
      const data = YASAI_DATA[type];
      document.getElementById('homeIconImg').src = data.img;
      document.getElementById('homeTitle').innerHTML = `${currentUserName}さんの<br>${data.name}の きろく`;
      const root = document.documentElement;
      if(type === 'tomato') { root.style.setProperty('--theme-bg', '#fef2f2'); root.style.setProperty('--theme-text-main', '#ef4444'); root.style.setProperty('--theme-border-medium', '#f87171'); root.style.setProperty('--theme-header-bg', '#ef4444'); root.style.setProperty('--theme-header-btn', '#dc2626'); }
      else if(type === 'nasu') { root.style.setProperty('--theme-bg', '#faf5ff'); root.style.setProperty('--theme-text-main', '#a855f7'); root.style.setProperty('--theme-border-medium', '#c084fc'); root.style.setProperty('--theme-header-bg', '#a855f7'); root.style.setProperty('--theme-header-btn', '#9333ea'); }
      else { root.style.setProperty('--theme-bg', '#f0fdf4'); root.style.setProperty('--theme-text-main', '#22c55e'); root.style.setProperty('--theme-border-medium', '#4ade80'); root.style.setProperty('--theme-header-bg', '#22c55e'); root.style.setProperty('--theme-header-btn', '#16a34a'); }
      renderWeeklyCalendar();
      updateStatus();
    }

    function showView(name, sound) {
      if(sound) playSound('click');
      document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
      document.getElementById('view-'+name).classList.remove('hidden');
      if(name === 'home') { renderWeeklyCalendar(); updateStatus(); }
      if(name === 'list') { renderList(); }
    }

    function renderWeeklyCalendar() {
      const grid = document.getElementById('weeklyCalendarGrid');
      grid.innerHTML = '';
      const today = new Date();
      const firstDay = new Date(today);
      firstDay.setDate(today.getDate() - today.getDay());
      const wateringDays = JSON.parse(localStorage.getItem('watering_days') || '[]');
      const weekNames = ['にち','げつ','か','すい','もく','きん','ど'];
      for(let i=0; i<7; i++) {
        const d = new Date(firstDay);
        d.setDate(firstDay.getDate() + i);
        const dateStr = `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
        const isToday = d.toDateString() === today.toDateString();
        const hasWatered = wateringDays.includes(dateStr);
        const cell = document.createElement('div');
        cell.className = `flex flex-col items-center p-2 rounded-2xl border-2 ${isToday ? 'border-theme-main bg-white shadow-md' : 'border-gray-100 bg-gray-50'}`;
        cell.innerHTML = `
          <div class="text-[10px] font-bold text-gray-500">${weekNames[i]}</div>
          <div class="text-sm font-bold ${isToday ? 'text-theme-main' : ''}">${d.getDate()}</div>
          <div class="h-8 md:h-10 flex items-center justify-center">${hasWatered ? '<img src="images/water_stamp.png" class="w-10 h-10 md:w-12 md:h-12 object-contain">' : ''}</div>
        `;
        grid.appendChild(cell);
      }
    }

    function updateStatus() {
      const wateringDays = JSON.parse(localStorage.getItem('watering_days') || '[]');
      const count = wateringDays.length;
      document.getElementById('totalStampCount').innerText = count;
      let rank = WATERING_TITLES[WATERING_TITLES.length - 1];
      for(let r of WATERING_TITLES) { if(count >= r.min) { rank = r; break; } }
      const rankName = rank.name.replace('[YASAI]', YASAI_DATA[currentYasai].name);
      document.getElementById('userTitle').innerText = rankName;
      document.getElementById('currentRankImg').src = rank.img;
      document.getElementById('titleProgressBar').style.width = Math.min(100, (count/30)*100) + '%';
    }

    function renderList() {
      const listContainer = document.getElementById('recordList');
      listContainer.innerHTML = '';
      let records = JSON.parse(localStorage.getItem('yasai_records')) || [];
      const currentData = YASAI_DATA[currentYasai];

      if (records.length === 0) {
        listContainer.innerHTML = `
          <div class="flex flex-col items-center justify-center h-full text-gray-500 mt-10 md:mt-20">
            <div class="text-6xl md:text-7xl mb-6"><img src="${currentData.img}" class="w-32 h-32 object-contain"></div>
            <div class="text-2xl md:text-3xl font-bold mb-4">まだ きろくが ないよ</div>
            <div class="text-xl md:text-2xl">しゃしんを とってみよう！</div>
          </div>
        `;
        return;
      }

      records.sort((a, b) => b.id - a.id);
      records.forEach((record) => {
        const item = document.createElement('div');
        item.className = 'snap-item bg-white p-4 md:p-6 shadow-2xl flex flex-col border-4 border-theme-light rounded-[2rem] w-full max-w-6xl mx-auto h-auto min-h-[70vh] shrink-0 gap-4 md:gap-6';
        
        const dateDiv = document.createElement('div');
        dateDiv.className = `w-full text-center pb-4 border-b-4 border-theme-main flex flex-col items-center shrink-0`;
        const iconToShow = currentData.icon;
        const recordName = record.userName || currentUserName;
        const waterBadge = record.watered 
          ? `<div class="bg-blue-100 text-blue-700 text-lg md:text-xl px-4 md:px-6 py-2 rounded-full font-bold mt-2 inline-flex items-center gap-2 border-2 border-blue-300 shadow-sm">💧 このひは みずやり したよ！</div>` 
          : `<div class="bg-gray-100 text-gray-500 text-base md:text-lg px-4 py-2 rounded-full font-bold mt-2 inline-block">みずやりの きろく なし</div>`;
        
        dateDiv.innerHTML = `
          <div class="text-lg md:text-xl text-gray-500 font-bold mb-1">${recordName}さんの</div>
          <div class="text-3xl md:text-4xl font-bold text-gray-800 flex justify-center items-center gap-2"><span>${iconToShow}</span> ${record.dateStr}</div>
          <div>${waterBadge}</div>
        `;

        const teacherBtns = document.createElement('div');
        teacherBtns.className = 'teacher-pdf-btn hidden flex gap-2 mt-4';
        
        const pdfBtn = document.createElement('button');
        pdfBtn.className = 'btn-3d bg-green-500 hover:bg-green-600 text-white px-5 py-3 rounded-2xl text-lg font-bold flex items-center gap-2 transition-colors shadow';
        pdfBtn.innerHTML = '🖨️ PDF';
        pdfBtn.onclick = () => downloadPDF(record.id);

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-3d bg-red-500 text-white px-5 py-3 rounded-2xl text-lg font-bold transition-colors shadow';
        delBtn.innerHTML = '🗑️ 消す';
        delBtn.onclick = () => { if(confirm('この きろくを けしても いい？')) { deleteRecord(record.id); } };
        
        teacherBtns.appendChild(pdfBtn);
        teacherBtns.appendChild(delBtn);
        dateDiv.appendChild(teacherBtns);

        const leftCol = document.createElement('div');
        leftCol.className = 'w-full h-72 sm:h-96 md:h-[500px] flex items-center justify-center bg-gray-100 border-4 border-gray-300 rounded-2xl overflow-hidden shrink-0 shadow-inner relative';
        const img = document.createElement('img');
        img.src = record.image;
        img.className = 'max-w-full max-h-full object-contain';
        leftCol.appendChild(img);
        
        const noticeContainer = document.createElement('div');
        noticeContainer.className = 'w-full grow flex flex-col border-4 border-blue-200 rounded-2xl p-4 md:p-6 bg-blue-50 shadow-inner min-h-[150px] md:min-h-[250px]';
        const noticeLabel = document.createElement('div');
        noticeLabel.className = 'text-xl md:text-2xl font-bold text-blue-700 mb-2 md:mb-3 border-b-2 border-blue-200 pb-2 shrink-0';
        noticeLabel.innerHTML = '✏️ きづいたこと';
        
        const noticeText = document.createElement('div');
        noticeText.className = 'text-lg md:text-2xl text-gray-800 grow overflow-y-auto whitespace-pre-wrap leading-relaxed font-medium';
        noticeText.innerHTML = record.notice || '（かいてないよ）';
        
        noticeContainer.appendChild(noticeLabel);
        noticeContainer.appendChild(noticeText);

        item.appendChild(dateDiv);
        item.appendChild(leftCol);
        item.appendChild(noticeContainer);

        listContainer.appendChild(item);
      });

      updateTeacherModeUI();
    }

    function startSecretPress(e) {
      cancelSecretPress();
      secretPressTimer = setTimeout(() => {
        isTeacherMode = !isTeacherMode;
        updateTeacherModeUI();
        playSound('success'); 
      }, 3000);
    }
    function cancelSecretPress(e) { clearTimeout(secretPressTimer); }

    function updateTeacherModeUI() {
      const batchBtn = document.getElementById('batchPdfBtn');
      const individualBtns = document.querySelectorAll('.teacher-pdf-btn');
      if (isTeacherMode) {
        batchBtn.classList.remove('hidden');
        individualBtns.forEach(btn => btn.classList.remove('hidden'));
      } else {
        batchBtn.classList.add('hidden');
        individualBtns.forEach(btn => btn.classList.add('hidden'));
      }
    }

    function downloadPDF(recordId = null) {
      playSound('click');
      let records = JSON.parse(localStorage.getItem('yasai_records')) || [];
      if (records.length === 0) {
        alert('きろくが まだ ないよ');
        return;
      }

      let targetRecords = records;
      let filename = '';
      if (recordId !== null) {
        targetRecords = records.filter(r => r.id === recordId);
        filename = `${YASAI_DATA[currentYasai].name}のきろく_${getFormatDate(new Date(recordId))}.pdf`;
      } else {
        filename = `${YASAI_DATA[currentYasai].name}のきろく_ぜんぶ_${getFormatDate(new Date())}.pdf`;
      }

      const modal = document.getElementById('modal-error');
      modal.classList.remove('hidden');
      document.getElementById('errorIcon').innerText = '⏳';
      document.getElementById('errorTitle').innerText = 'ちょっと まってね';
      document.getElementById('errorTitle').className = 'text-2xl font-bold mb-2 text-blue-500';
      document.getElementById('errorMsg').innerHTML = 'PDFを つくっています...<br>そのまま まってね';
      document.getElementById('errorButtons').classList.add('hidden');

      const pdfContainer = document.createElement('div');
      pdfContainer.style.width = '794px'; 
      pdfContainer.style.backgroundColor = 'white';
      pdfContainer.style.color = '#1f2937';
      const sortedRecords = [...targetRecords].sort((a, b) => a.id - b.id);

      sortedRecords.forEach((record, index) => {
        const page = document.createElement('div');
        page.style.width = '794px';
        page.style.height = '1120px'; 
        page.style.padding = '50px';
        page.style.boxSizing = 'border-box';
        page.style.display = 'flex';
        page.style.flexDirection = 'column';
        page.style.overflow = 'hidden'; 
        if (index !== sortedRecords.length - 1) page.style.pageBreakAfter = 'always';

        const data = YASAI_DATA[record.yasai || currentYasai];
        const iconToShow = data.icon;
        const recordName = record.userName || currentUserName;
        const waterText = record.watered ? '💧 このひは みずやり したよ！' : '（みずやりの きろく なし）';
        const waterColor = record.watered ? '#1d4ed8' : '#9ca3af';
        const waterBg = record.watered ? '#dbeafe' : '#f3f4f6';
        const waterBorder = record.watered ? '2px solid #93c5fd' : 'none';

        page.innerHTML = `
          <div style="font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 10px; color: #6b7280; font-family: sans-serif;">
            ${recordName}さんの
          </div>
          <div style="font-size: 36px; font-weight: bold; text-align: center; margin-bottom: 15px; border-bottom: 4px solid ${data.pdfColor}; padding-bottom: 10px; font-family: sans-serif;">
            ${iconToShow} ${record.dateStr} の きろく
          </div>
          <div style="display: flex; justify-content: center; margin-bottom: 25px;">
            <div style="background-color: ${waterBg}; color: ${waterColor}; border: ${waterBorder}; font-size: 20px; font-weight: bold; padding: 10px 24px; border-radius: 99px; font-family: sans-serif;">
              ${waterText}
            </div>
          </div>
          <div style="width: 100%; height: 460px; display: flex; justify-content: center; align-items: center; background-color: #f9fafb; border: 4px solid #e5e7eb; border-radius: 16px; margin-bottom: 30px; overflow: hidden;">
            <img src="${record.image}" style="max-width: 100%; max-height: 100%; object-fit: contain;">
          </div>
          <div style="flex: 1; border: 4px solid #bfdbfe; border-radius: 16px; padding: 30px; background-color: #eff6ff; display: flex; flex-direction: column;">
            <div style="font-size: 24px; font-weight: bold; color: #1d4ed8; margin-bottom: 15px; font-family: sans-serif;">
              ✏️ きづいたこと
            </div>
            <div style="font-size: 24px; line-height: 1.6; white-space: pre-wrap; font-family: sans-serif; flex: 1; font-weight: bold;">${record.notice || '（かいてないよ）'}</div>
          </div>
        `;
        pdfContainer.appendChild(page);
      });

      const opt = {
        margin: 0,
        filename: filename, 
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'px', format: [794, 1123], orientation: 'portrait' }
      };

      setTimeout(() => {
        html2pdf().set(opt).from(pdfContainer).save().then(() => {
          modal.classList.add('hidden');
          playSound('success'); 
        }).catch(e => {
          modal.classList.add('hidden');
          alert('PDFが つくれなかったよ。');
        });
      }, 500);
    }

    async function startCamera() {
      showView('camera', 'photo');
      const video = document.getElementById('cameraVideo');
      videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = videoStream;
    }
    function stopCamera() { if(videoStream) videoStream.getTracks().forEach(t => t.stop()); }

    function takePhoto() {
      playSound('photo');
      const video = document.getElementById('cameraVideo');
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      currentImageData = canvas.toDataURL('image/jpeg', 0.7);
      document.getElementById('previewImage').src = currentImageData;
      document.getElementById('previewDate').innerText = `${new Date().getMonth()+1}がつ ${new Date().getDate()}にち`;
      stopCamera();
      initPreview();
      showView('preview', false);
    }

    function initPreview() {
      currentNoticeIndex = -1;
      noticePage = 0;
      isPreviewWatered = JSON.parse(localStorage.getItem('watering_days') || '[]').includes(`${new Date().getFullYear()}-${new Date().getMonth()+1}-${new Date().getDate()}`);
      renderNoticeOptions();
      updatePreviewWaterBtn();
      switchInputMode('card');
    }

    function switchInputMode(mode) {
      playSound('click');
      currentInputMode = mode;
      document.getElementById('inputModeCard').classList.toggle('hidden', mode !== 'card');
      document.getElementById('inputModeText').classList.toggle('hidden', mode !== 'text');
      document.getElementById('tabCardBtn').className = mode === 'card' ? 'btn-3d px-4 py-2 bg-green-500 text-white font-bold rounded-xl text-sm md:text-lg' : 'btn-3d px-4 py-2 bg-gray-200 text-gray-600 font-bold rounded-xl text-sm md:text-lg';
      document.getElementById('tabTextBtn').className = mode === 'text' ? 'btn-3d px-4 py-2 bg-blue-500 text-white font-bold rounded-xl text-sm md:text-lg' : 'btn-3d px-4 py-2 bg-gray-200 text-gray-600 font-bold rounded-xl text-sm md:text-lg';
    }

    function renderNoticeOptions() {
      const grid = document.getElementById('noticeOptionsGrid');
      grid.innerHTML = '';
      const opts = NOTICE_OPTIONS[currentYasai];
      const start = noticePage * 2;
      for(let i=start; i<Math.min(start+2, opts.length); i++) {
        const o = opts[i];
        const btn = document.createElement('button');
        btn.className = `btn-3d rounded-2xl p-1 flex flex-col items-center justify-center border-4 h-full overflow-hidden ${currentNoticeIndex===i ? 'border-blue-500 bg-blue-50' : 'border-gray-100 bg-white'}`;
        btn.onclick = () => { currentNoticeIndex = i; playSound('click'); renderNoticeOptions(); };
        btn.innerHTML = `
          <div class="flex-1 w-full flex items-center justify-center p-1"><img src="${o.img}" class="h-full w-full object-contain"></div>
          <span class="text-[11px] md:text-sm font-bold text-gray-600 px-1 py-1 leading-tight shrink-0">${o.shortText}</span>
        `;
        grid.appendChild(btn);
      }
      document.getElementById('prevNoticeBtn').disabled = noticePage === 0;
      document.getElementById('nextNoticeBtn').disabled = start + 2 >= opts.length;
    }

    function changeNoticePage(d) { noticePage += d; playSound('click'); renderNoticeOptions(); }
    function toggleWateringInPreview() { if(isPreviewWatered) return; isPreviewWatered = true; playSound('water'); updatePreviewWaterBtn(); }

    function updatePreviewWaterBtn() {
      const b = document.getElementById('previewWaterBtn');
      if(isPreviewWatered) {
        b.className = "w-full flex-1 bg-gray-200 text-gray-400 rounded-2xl flex flex-col items-center justify-center";
        b.innerHTML = '<img src="images/water_stamp.png" class="w-16 h-16 opacity-30"><span class="font-bold text-lg">できた！</span>';
      } else {
        b.className = "btn-3d w-full flex-1 bg-blue-500 text-white rounded-2xl flex flex-col items-center justify-center";
        b.innerHTML = '<img src="images/water_stamp.png" class="w-16 h-16 drop-shadow"><span class="font-bold text-lg">あげたよ！</span>';
      }
    }

    function saveRecord() {
      const records = JSON.parse(localStorage.getItem('yasai_records') || '[]');
      const date = new Date();
      const dateKey = `${date.getFullYear()}-${date.getMonth()+1}-${date.getDate()}`;
      let noticeHtml = '';
      if(currentInputMode === 'card') {
        if(currentNoticeIndex === -1) return;
        const o = NOTICE_OPTIONS[currentYasai][currentNoticeIndex];
        noticeHtml = o.text;
      } else {
        noticeHtml = document.getElementById('noticeText').value;
      }
      records.push({ id: Date.now(), image: currentImageData, notice: noticeHtml, dateStr: `${date.getMonth()+1}がつ ${date.getDate()}にち`, yasai: currentYasai, watered: isPreviewWatered, userName: currentUserName });
      localStorage.setItem('yasai_records', JSON.stringify(records));
      if(isPreviewWatered) {
        const w = JSON.parse(localStorage.getItem('watering_days') || '[]');
        if(!w.includes(dateKey)) { w.push(dateKey); localStorage.setItem('watering_days', JSON.stringify(w)); checkLevelUp(w.length); } 
        else { showSuccess(); }
      } else { showSuccess(); }
    }

    function checkLevelUp(count) {
      const rank = WATERING_TITLES.find(r => r.min === count);
      if(rank) {
        document.getElementById('modalRankImg').src = rank.img;
        document.getElementById('modalRankName').innerText = rank.name.replace('[YASAI]', YASAI_DATA[currentYasai].name);
        document.getElementById('modal-levelup').classList.remove('hidden');
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      } else { showSuccess(); }
    }

    function showSuccess() {
      const m = document.getElementById('modal-success');
      m.innerHTML = '<div class="bg-white p-10 rounded-[3rem] animate-pop-in text-center"><div class="text-7xl mb-4">💮</div><div class="text-3xl font-bold text-red-500">きろく したよ！</div></div>';
      m.classList.remove('hidden');
      setTimeout(() => { m.classList.add('hidden'); showView('home', false); }, 2000);
    }

    function deleteRecord(id) {
      let records = JSON.parse(localStorage.getItem('yasai_records') || '[]');
      records = records.filter(r => r.id !== id);
      localStorage.setItem('yasai_records', JSON.stringify(records));
      renderList();
    }

    function startResetPress() { resetTimer = setTimeout(() => { document.getElementById('modal-reset').classList.remove('hidden'); playSound('click'); }, 3000); }
    function cancelResetPress() { clearTimeout(resetTimer); }
    function executeClear() { localStorage.clear(); location.reload(); }
    function goToSelectView() { localStorage.removeItem('user_name'); location.reload(); }
    function closeLevelUpModal() { document.getElementById('modal-levelup').classList.add('hidden'); showView('home', false); }
    function showLargeRank() {
      const wateringDays = JSON.parse(localStorage.getItem('watering_days') || '[]');
      const count = wateringDays.length;
      let rank = WATERING_TITLES[WATERING_TITLES.length - 1];
      for(let r of WATERING_TITLES) { if(count >= r.min) { rank = r; break; } }
      const rankName = rank.name.replace('[YASAI]', YASAI_DATA[currentYasai].name);
      document.getElementById('largeRankImg').src = rank.img;
      document.getElementById('largeRankName').innerText = rankName;
      document.getElementById('modal-rank-large').classList.remove('hidden');
      playSound('click');
    }

    // ★ テストモード切り替えとスタンプ追加用の関数
    function toggleTestMode() {
      isTestMode = !isTestMode;
      const btn = document.getElementById('testModeBtn');
      if (isTestMode) {
        btn.innerText = 'テストモード：ON';
        btn.classList.replace('bg-purple-500', 'bg-purple-700');
      } else {
        btn.innerText = 'テストモード：OFF';
        btn.classList.replace('bg-purple-700', 'bg-purple-500');
      }
      playSound('click');
    }

    function addTestStamp() {
      if(!isTestMode) return;
      playSound('water');
      const w = JSON.parse(localStorage.getItem('watering_days') || '[]');
      w.push(`test-${Date.now()}`); // テスト用のダミー日付で強制追加
      localStorage.setItem('watering_days', JSON.stringify(w));
      updateStatus();
      checkLevelUp(w.length);
    }
  </script>
</body>
</html>
