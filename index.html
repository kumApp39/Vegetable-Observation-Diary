<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="やさいかんさつ">
  <link rel="apple-touch-icon" href="./icon.png?v=6">
  <link rel="icon" type="image/png" href="./icon.png?v=6">
  <title>やさい かんさつ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --theme-bg: #fef2f2;
      --theme-text-dark: #b91c1c;
      --theme-text-main: #ef4444;
      --theme-border-light: #fecaca;
      --theme-border-medium: #f87171;
      --theme-border-main: #ef4444;
      --theme-header-bg: #ef4444;
      --theme-header-btn: #dc2626;
    }
    .bg-theme-bg { background-color: var(--theme-bg); }
    .text-theme-dark { color: var(--theme-text-dark); }
    .text-theme-main { color: var(--theme-text-main); }
    .border-theme-light { border-color: var(--theme-border-light); }
    .border-theme-medium { border-color: var(--theme-border-medium); }
    .border-theme-main { border-color: var(--theme-border-main); }
    .bg-theme-header { background-color: var(--theme-header-bg); }
    .bg-theme-btn { background-color: var(--theme-header-btn); }

    body {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      overscroll-behavior: none;
      font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN W4", sans-serif;
      overflow: hidden;
    }
    .scrollable {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }
    .btn-3d {
      box-shadow: 0 6px 0 rgba(0,0,0,0.15);
      transition: all 0.1s;
    }
    .btn-3d:active:not(:disabled) {
      box-shadow: 0 0 0 rgba(0,0,0,0);
      transform: translateY(6px);
    }
    .calendar-cell {
      aspect-ratio: 1 / 1;
    }
    .snap-container {
      scroll-snap-type: y mandatory;
    }
    .snap-item {
      scroll-snap-align: start;
      scroll-margin-top: 1rem;
    }
    img {
      color: transparent;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative text-gray-800 bg-theme-bg">

  <!-- 0. なまえとやさいを えらぶ がめん -->
  <div id="view-select" class="view hidden scrollable flex flex-col items-center justify-start h-full w-full px-4 md:px-8 py-12 md:py-16 box-border">
    <div class="w-full max-w-md mb-8 bg-white p-6 md:p-8 rounded-[3rem] shadow-md border-4 border-gray-200 shrink-0 mt-4">
      <h1 class="text-2xl md:text-3xl font-bold text-gray-700 mb-4 text-center leading-relaxed">はじめに なまえを<br>おしえてね</h1>
      <input type="text" id="userNameInput" class="w-full rounded-2xl p-4 text-2xl font-bold border-4 border-gray-300 text-center focus:border-green-500 outline-none bg-gray-50" placeholder="ここを タップ">
      <div id="nameError" class="hidden text-red-500 text-xl font-bold text-center mt-2 animate-bounce">なまえを かいてね！</div>
    </div>

    <h1 class="text-3xl md:text-4xl font-bold text-gray-700 mb-6 text-center leading-relaxed shrink-0">どの やさい を<br>そだてる？</h1>
    <div class="flex flex-col md:flex-row justify-center gap-4 w-full max-w-4xl shrink-0 px-2 pb-10">
      <button onclick="selectYasai('tomato')" class="btn-3d bg-red-400 hover:bg-red-500 text-white rounded-[2rem] md:rounded-[3rem] py-6 md:py-8 px-4 flex flex-col items-center justify-center gap-4 flex-1">
        <div class="w-24 h-24 md:w-32 md:h-32 transform hover:scale-110 transition-transform">
          <img src="images/tomato_main.png" alt="トマト" class="w-full h-full object-contain drop-shadow-lg">
        </div>
        <span class="text-2xl md:text-4xl font-bold">トマト</span>
      </button>
      <button onclick="selectYasai('nasu')" class="btn-3d bg-purple-400 hover:bg-purple-500 text-white rounded-[2rem] md:rounded-[3rem] py-6 md:py-8 px-4 flex flex-col items-center justify-center gap-4 flex-1">
        <div class="w-24 h-24 md:w-32 md:h-32 transform hover:scale-110 transition-transform">
          <img src="images/nasu_main.png" alt="ナス" class="w-full h-full object-contain drop-shadow-lg">
        </div>
        <span class="text-2xl md:text-4xl font-bold">ナス</span>
      </button>
      <button onclick="selectYasai('piman')" class="btn-3d bg-green-400 hover:bg-green-500 text-white rounded-[2rem] md:rounded-[3rem] py-6 md:py-8 px-4 flex flex-col items-center justify-center gap-4 flex-1">
        <div class="w-24 h-24 md:w-32 md:h-32 transform hover:scale-110 transition-transform">
          <img src="images/piman_main.png" alt="ピーマン" class="w-full h-full object-contain drop-shadow-lg">
        </div>
        <span class="text-2xl md:text-4xl font-bold">ピーマン</span>
      </button>
    </div>
  </div>

  <!-- 1. さいしょの がめん（ホーム） -->
  <div id="view-home" class="view hidden flex flex-col items-center justify-start h-full w-full px-4 md:px-8 pt-10 md:pt-16 pb-8 md:pb-12 box-border">
    <div class="flex items-center gap-3 mb-2 md:mb-4 shrink-0 cursor-pointer"
         ontouchstart="startResetPress(event)" 
         ontouchend="cancelResetPress(event)" 
         ontouchcancel="cancelResetPress(event)" 
         onmousedown="startResetPress(event)" 
         onmouseup="cancelResetPress(event)" 
         onmouseleave="cancelResetPress(event)" 
         style="touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;">
      <img id="homeIconImg" src="" alt="やさい" class="w-12 h-12 md:w-16 md:h-16 object-contain drop-shadow-md pointer-events-none">
      <h1 id="homeTitle" class="text-2xl md:text-4xl font-bold text-theme-dark pointer-events-none">やさいの きろく</h1>
    </div>
    
    <div class="flex flex-col md:flex-row gap-3 w-full max-w-5xl flex-1 min-h-0">
      <div class="flex flex-col gap-3 flex-1 min-h-0">
        <div class="bg-yellow-50 rounded-2xl p-3 md:p-4 border-4 border-yellow-300 shadow-sm shrink-0 flex flex-col items-center relative overflow-hidden">
          <div class="absolute -top-4 -right-4 text-5xl opacity-20">✨</div>
          <div class="absolute -bottom-4 -left-4 text-5xl opacity-20">🌟</div>
          
          <div class="text-base md:text-lg font-bold text-yellow-800 mb-1.5 z-10">
            あつめた スタンプ： <span id="totalStampCount" class="text-3xl md:text-4xl text-theme-main mx-1">0</span> こ
          </div>
          
          <div class="bg-white px-4 py-2 rounded-xl w-full border-2 border-yellow-200 text-center z-10 mb-1.5">
            <div class="text-xs md:text-sm text-gray-500 font-bold mb-0.5">👑 いまの しょうごう</div>
            <div id="userTitle" class="text-lg md:text-2xl font-bold text-orange-500">はじめての みずやり 🥚</div>
          </div>
          
          <div class="w-full bg-yellow-200 rounded-full h-3 mt-1 overflow-hidden relative z-10">
            <div id="titleProgressBar" class="bg-orange-400 h-full transition-all duration-1000 ease-out" style="width: 0%"></div>
          </div>
          <div id="nextTitleHint" class="text-xs md:text-sm font-bold text-yellow-700 mt-1 z-10">つぎの しょうごう まで あと 3こ！</div>
        </div>

        <div class="bg-white rounded-2xl p-2 md:p-4 border-4 border-theme-light shadow-sm flex flex-col flex-1 min-h-0">
          <div class="flex justify-between items-center mb-1 md:mb-2 bg-theme-bg rounded-xl p-1 md:p-2 shrink-0">
            <button onclick="changeMonth(-1)" class="btn-3d bg-white text-theme-main rounded-full w-10 h-10 md:w-12 md:h-12 text-lg md:text-xl font-bold flex items-center justify-center shadow">◀</button>
            <h2 id="calendarTitle" class="text-lg md:text-2xl font-bold text-theme-dark">〇がつ</h2>
            <button onclick="changeMonth(1)" class="btn-3d bg-white text-theme-main rounded-full w-10 h-10 md:w-12 md:h-12 text-lg md:text-xl font-bold flex items-center justify-center shadow">▶</button>
          </div>
          <div class="flex-1 overflow-y-auto">
            <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center w-full pb-1">
            </div>
          </div>
        </div>
      </div>

      <div class="flex flex-col gap-4 w-full md:w-80 shrink-0 justify-center pb-2 md:pb-0">
        <button onclick="startCamera()" class="btn-3d bg-orange-400 text-white rounded-[2rem] p-6 md:p-8 text-2xl md:text-3xl font-bold flex flex-col items-center justify-center gap-3">
          <span class="text-6xl md:text-7xl">📷</span>
          <span>しゃしんをとる</span>
        </button>
        <button onclick="showView('list', 'list')" class="btn-3d bg-green-500 text-white rounded-[2rem] p-6 md:p-8 text-2xl md:text-3xl font-bold flex flex-col items-center justify-center gap-3">
          <span class="text-6xl md:text-7xl">📖</span>
          <span>これまでのきろく</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 1.5 カメラがめん -->
  <div id="view-camera" class="view hidden flex flex-col items-center justify-center h-full w-full bg-black relative">
    <video id="cameraVideo" autoplay playsinline class="w-full h-full object-cover"></video>
    <div class="absolute top-10 md:top-14 left-6 md:left-8 z-10">
      <button onclick="stopCamera(); showView('home', 'back')" class="bg-gray-800 bg-opacity-70 text-white px-6 py-4 rounded-full text-xl md:text-2xl font-bold active:bg-gray-700">◀ やめる</button>
    </div>
    <div class="absolute bottom-12 w-full flex justify-center z-10">
      <button onclick="takePhoto()" class="w-24 h-24 md:w-32 md:h-32 bg-white rounded-full border-[10px] md:border-[12px] border-gray-300 active:bg-gray-200 transition-colors shadow-2xl flex items-center justify-center"></button>
    </div>
  </div>

  <!-- 2. しゃしんを かくにんする がめん（プレビュー） -->
  <div id="view-preview" class="view hidden scrollable flex flex-col items-center justify-start h-full w-full px-4 md:px-8 pt-10 md:pt-16 pb-16 md:pb-24 box-border">
    <h2 class="text-3xl md:text-4xl font-bold text-blue-700 mb-4 md:mb-6" id="previewDate">〇がつ〇にち</h2>
    
    <div class="w-full max-w-4xl h-56 md:h-72 bg-white rounded-3xl shadow-inner flex items-center justify-center overflow-hidden mb-4 border-4 border-gray-200 p-2 shrink-0">
      <img id="previewImage" src="" alt="とったしゃしん" class="max-w-full max-h-full object-contain rounded-2xl">
    </div>

    <!-- タブ切り替え -->
    <div class="w-full max-w-4xl mb-4 shrink-0 flex gap-2 md:gap-4 justify-center">
      <button id="tabCardBtn" onclick="switchInputMode('card')" class="btn-3d flex-1 bg-green-500 text-white font-bold py-3 md:py-4 rounded-2xl text-xl md:text-2xl transition-colors shadow">カードで えらぶ</button>
      <button id="tabTextBtn" onclick="switchInputMode('text')" class="btn-3d flex-1 bg-gray-200 text-gray-600 font-bold py-3 md:py-4 rounded-2xl text-xl md:text-2xl transition-colors shadow">じぶんで かく</button>
    </div>

    <!-- カードでえらぶエリア -->
    <div id="inputModeCard" class="w-full max-w-4xl mb-4 md:mb-6 shrink-0 bg-white p-4 md:p-6 rounded-3xl shadow-sm border-4 border-green-200">
      <label class="block text-2xl md:text-3xl font-bold text-green-700 mb-4 flex justify-center items-center gap-2">
        <span>✏️</span> いまの ようすは どっちかな？
      </label>
      <div class="flex items-stretch justify-center gap-2 md:gap-6 h-80 md:h-[26rem]">
        <button id="prevNoticeBtn" onclick="changeNoticePage(-1)" class="btn-3d bg-green-100 text-green-700 hover:bg-green-200 rounded-2xl w-14 md:w-20 text-3xl md:text-4xl font-bold flex items-center justify-center transition-colors disabled:opacity-30 disabled:cursor-not-allowed">◀</button>
        <div id="noticeOptionsGrid" class="grid grid-cols-2 gap-3 md:gap-6 flex-1 w-full max-w-3xl">
        </div>
        <button id="nextNoticeBtn" onclick="changeNoticePage(1)" class="btn-3d bg-green-100 text-green-700 hover:bg-green-200 rounded-2xl w-14 md:w-20 text-3xl md:text-4xl font-bold flex items-center justify-center transition-colors disabled:opacity-30 disabled:cursor-not-allowed">▶</button>
      </div>
      <div id="noticePageIndicator" class="text-center mt-5 font-bold text-green-600 text-lg md:text-xl">1 / 3</div>
    </div>

    <!-- じぶんでかくエリア -->
    <div id="inputModeText" class="w-full max-w-4xl mb-4 md:mb-6 shrink-0 bg-white p-4 md:p-6 rounded-3xl shadow-sm border-4 border-blue-200 hidden">
      <label class="block text-2xl md:text-3xl font-bold text-blue-700 mb-4 flex justify-center items-center gap-2">
        <span>✏️</span> きづいたこと を かいてみよう
      </label>
      <textarea id="noticeText" class="w-full rounded-2xl p-4 md:p-6 text-xl md:text-3xl border-4 border-gray-200 bg-gray-50 shadow-inner h-64 md:h-80 resize-none outline-none focus:border-blue-400" placeholder="ここを タップして かいてね"></textarea>
    </div>

    <div class="w-full max-w-4xl mb-6 md:mb-8 shrink-0 bg-blue-50 p-4 md:p-6 rounded-3xl border-4 border-blue-200 flex flex-col items-center shadow-inner">
      <h3 class="text-xl md:text-2xl font-bold text-blue-700 mb-3 md:mb-4 flex items-center gap-2">
        <img src="images/water_stamp.png" class="w-8 h-8 md:w-10 md:h-10 object-contain" alt="じょうろ">
        きょうは みずを あげたかな？
      </h3>
      <button id="previewWaterBtn" onclick="toggleWateringInPreview()" class="btn-3d bg-blue-500 text-white rounded-[2rem] py-4 px-6 md:px-8 text-2xl md:text-3xl font-bold w-full max-w-md flex justify-center items-center gap-3 transition-all">
        みずを あげたよ！
      </button>
      <div id="previewWaterStamp" class="hidden mt-4 animate-bounce">
        <!-- 共通の「じょうろ」スタンプ画像 -->
        <img src="images/water_stamp.png" class="w-20 h-20 md:w-24 md:h-24 object-contain drop-shadow-md" alt="みずやりスタンプ">
      </div>
    </div>
    
    <div class="flex gap-4 md:gap-6 w-full max-w-4xl pb-8 shrink-0">
      <button onclick="startCamera()" class="btn-3d bg-gray-400 text-white rounded-[2rem] p-4 md:p-6 text-2xl md:text-3xl font-bold flex-1">とりなおす</button>
      <button onclick="saveRecord()" class="btn-3d bg-red-500 text-white rounded-[2rem] p-4 md:p-6 text-2xl md:text-3xl font-bold flex-1">きろくする</button>
    </div>
  </div>

  <!-- 3. これまでの きろく をみる がめん（リスト） -->
  <div id="view-list" class="view hidden flex flex-col h-full w-full">
    <div class="bg-theme-header text-white pt-10 md:pt-14 pb-4 md:pb-6 px-4 md:px-8 flex justify-between items-center shadow-md shrink-0 z-10 relative">
      <button onclick="showView('home', 'back')" class="bg-theme-btn px-4 md:px-6 py-3 md:py-4 rounded-2xl text-xl md:text-2xl font-bold transition-colors">◀ もどる</button>
      
      <!-- 先生モード起動：タイトルを3秒長押し -->
      <h2 class="text-2xl md:text-4xl font-bold cursor-pointer" 
          ontouchstart="startSecretPress(event)" 
          ontouchend="cancelSecretPress(event)" 
          ontouchcancel="cancelSecretPress(event)" 
          onmousedown="startSecretPress(event)" 
          onmouseup="cancelSecretPress(event)" 
          onmouseleave="cancelSecretPress(event)" 
          style="touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;">これまでの きろく</h2>
          
      <div class="flex gap-4">
        <button id="batchPdfBtn" onclick="downloadPDF()" class="hidden btn-3d bg-blue-600 px-3 md:px-4 py-2 md:py-3 rounded-xl text-lg md:text-xl font-bold transition-colors border-2 border-white shadow-sm flex flex-col items-center">
          <span>🖨️ ぜんぶ PDF ほぞん</span>
          <span class="text-xs md:text-sm">(せんせい用)</span>
        </button>
      </div>
    </div>
    
    <div id="recordList" class="scrollable snap-container flex-1 p-4 md:p-8 flex flex-col gap-8 pb-16 md:pb-24 bg-gray-100">
      <!-- JavaScriptでここに記録が追加されます -->
    </div>
  </div>

  <!-- モーダル類 -->
  <div id="modal-success" class="hidden absolute inset-0 bg-black bg-opacity-40 z-50 flex items-center justify-center p-4"></div>
  
  <div id="modal-error" class="hidden absolute inset-0 bg-white z-50 flex flex-col items-center justify-center p-8 text-center">
    <div id="errorIcon" class="text-7xl md:text-8xl mb-6">⚠️</div>
    <div id="errorTitle" class="text-3xl md:text-4xl text-red-500 font-bold mb-6 md:mb-8">おかしいな？</div>
    <div class="text-2xl md:text-3xl text-gray-700 mb-10 md:mb-12 leading-relaxed" id="errorMsg">せんせいを よんでね</div>
    <div id="errorButtons" class="flex gap-4 w-full max-w-md">
      <!-- ★「もどる」ボタンに変更 -->
      <button onclick="document.getElementById('modal-error').classList.add('hidden')" class="btn-3d bg-blue-400 text-white text-2xl md:text-3xl px-6 py-5 md:py-6 rounded-3xl font-bold flex-1">もどる</button>
      <button onclick="showConfirm()" id="clearBtn" class="hidden btn-3d bg-red-400 text-white text-2xl md:text-3xl px-6 py-5 md:py-6 rounded-3xl font-bold flex-1">きろくを けす</button>
    </div>
  </div>

  <div id="modal-confirm" class="hidden absolute inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-[2rem] p-6 md:p-8 flex flex-col items-center max-w-lg w-full text-center">
      <div class="text-5xl md:text-6xl mb-4">🗑️</div>
      <div class="text-2xl md:text-3xl font-bold text-gray-800 mb-6 md:mb-8 leading-normal">ほんとうに ぜんぶ<br>けしても いいですか？</div>
      <div class="flex gap-4 w-full">
        <button onclick="closeConfirm()" class="btn-3d bg-gray-400 text-white text-2xl md:text-3xl px-4 py-5 md:py-6 rounded-3xl font-bold flex-1">やめる</button>
        <button onclick="executeClear()" class="btn-3d bg-red-500 text-white text-2xl md:text-3xl px-4 py-5 md:py-6 rounded-3xl font-bold flex-1">けす</button>
      </div>
    </div>
  </div>

  <!-- 先生用リセットメニュー -->
  <div id="modal-reset" class="hidden absolute inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-[2rem] p-6 md:p-8 flex flex-col items-center max-w-lg w-full text-center border-8 border-orange-300">
      <div class="text-xl font-bold text-gray-500 mb-2">せんせいメニュー</div>
      <div class="text-2xl md:text-3xl font-bold text-gray-800 mb-6 md:mb-8 leading-normal">どうしますか？</div>
      
      <div class="flex flex-col gap-4 w-full mb-6">
        <button onclick="goToSelectView()" class="btn-3d bg-orange-500 text-white text-xl md:text-2xl py-4 rounded-3xl font-bold w-full">なまえ・やさいを えらびなおす</button>
        <button onclick="showConfirmFromMenu()" class="btn-3d bg-red-500 text-white text-xl md:text-2xl py-4 rounded-3xl font-bold w-full">きろくを ぜんぶ けす</button>
      </div>

      <button onclick="closeResetConfirm()" class="btn-3d bg-gray-400 text-white text-xl md:text-2xl py-4 rounded-3xl font-bold w-full max-w-xs">やめる</button>
    </div>
  </div>

  <script>
    const YASAI_DATA = {
      'tomato': { name: 'トマト', img: 'images/tomato_main.png', pdfColor: '#ef4444' },
      'nasu': { name: 'ナス', img: 'images/nasu_main.png', pdfColor: '#a855f7' },
      'piman': { name: 'ピーマン', img: 'images/piman_main.png', pdfColor: '#22c55e' }
    };

    function setThemeColors(type) {
      const root = document.documentElement;
      if (type === 'tomato') {
        root.style.setProperty('--theme-bg', '#fef2f2'); 
        root.style.setProperty('--theme-text-dark', '#b91c1c'); 
        root.style.setProperty('--theme-text-main', '#ef4444'); 
        root.style.setProperty('--theme-border-light', '#fecaca'); 
        root.style.setProperty('--theme-border-medium', '#f87171'); 
        root.style.setProperty('--theme-border-main', '#ef4444'); 
        root.style.setProperty('--theme-header-bg', '#ef4444'); 
        root.style.setProperty('--theme-header-btn', '#dc2626'); 
      } else if (type === 'nasu') {
        root.style.setProperty('--theme-bg', '#faf5ff'); 
        root.style.setProperty('--theme-text-dark', '#7e22ce'); 
        root.style.setProperty('--theme-text-main', '#a855f7'); 
        root.style.setProperty('--theme-border-light', '#e9d5ff'); 
        root.style.setProperty('--theme-border-medium', '#c084fc'); 
        root.style.setProperty('--theme-border-main', '#a855f7'); 
        root.style.setProperty('--theme-header-bg', '#a855f7'); 
        root.style.setProperty('--theme-header-btn', '#9333ea'); 
      } else if (type === 'piman') {
        root.style.setProperty('--theme-bg', '#f0fdf4'); 
        root.style.setProperty('--theme-text-dark', '#15803d'); 
        root.style.setProperty('--theme-text-main', '#22c55e'); 
        root.style.setProperty('--theme-border-light', '#bbf7d0'); 
        root.style.setProperty('--theme-border-medium', '#4ade80'); 
        root.style.setProperty('--theme-border-main', '#22c55e'); 
        root.style.setProperty('--theme-header-bg', '#22c55e'); 
        root.style.setProperty('--theme-header-btn', '#16a34a'); 
      }
    }

    const WATERING_TITLES = [

    function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      gain.gain.value = 0;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(0);
      osc.stop(0.1);
      document.removeEventListener('touchstart', unlockAudio);
      document.removeEventListener('touchend', unlockAudio);
      document.removeEventListener('click', unlockAudio);
    }
    
    document.addEventListener('touchstart', unlockAudio);
    document.addEventListener('touchend', unlockAudio);
    document.addEventListener('click', unlockAudio);

    function playSound(type) {
      if (!audioCtx) unlockAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'click') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
        gainNode.gain.setValueAtTime(0.2, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'start') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        osc.frequency.setValueAtTime(783.99, now + 0.2);
        osc.frequency.setValueAtTime(1046.50, now + 0.3);
        gainNode.gain.setValueAtTime(0.3, now);
        gainNode.gain.linearRampToValueAtTime(0, now + 0.6);
        osc.start(now); osc.stop(now + 0.6);
      } else if (type === 'water') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.15);
        gainNode.gain.setValueAtTime(0.4, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
      } else if (type === 'photo') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.linearRampToValueAtTime(800, now + 0.1);
        gainNode.gain.setValueAtTime(0.2, now);
        gainNode.gain.linearRampToValueAtTime(0, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else if (type === 'camera') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.setValueAtTime(0, now + 0.05);
        osc.frequency.setValueAtTime(1200, now + 0.1);
        gainNode.gain.setValueAtTime(0.1, now);
        gainNode.gain.linearRampToValueAtTime(0, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
      } else if (type === 'month') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
        gainNode.gain.setValueAtTime(0.2, now);
        gainNode.gain.linearRampToValueAtTime(0, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'list') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.setValueAtTime(600, now + 0.1);
        gainNode.gain.setValueAtTime(0.15, now);
        gainNode.gain.linearRampToValueAtTime(0, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else if (type === 'back') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.linearRampToValueAtTime(200, now + 0.15);
        gainNode.gain.setValueAtTime(0.2, now);
        gainNode.gain.linearRampToValueAtTime(0, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
      } else if (type === 'success') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        osc.frequency.setValueAtTime(783.99, now + 0.2);
        osc.frequency.setValueAtTime(1046.50, now + 0.3);
        gainNode.gain.setValueAtTime(0.2, now);
        gainNode.gain.linearRampToValueAtTime(0, now + 0.6);
        osc.start(now); osc.stop(now + 0.6);
      } else if (type === 'levelup') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(554.37, now + 0.15);
        osc.frequency.setValueAtTime(659.25, now + 0.3);
        osc.frequency.setValueAtTime(880, now + 0.45);
        gainNode.gain.setValueAtTime(0.2, now);
        gainNode.gain.linearRampToValueAtTime(0, now + 0.8);
        osc.start(now); osc.stop(now + 0.8);
      }
    }

    function takePhoto() {
      playSound('camera'); 
      const video = document.getElementById('cameraVideo');
      const canvas = document.createElement('canvas');
      const MAX_WIDTH = 800;
      let width = video.videoWidth;
      let height = video.videoHeight;
      if (width > MAX_WIDTH) {
        height = Math.floor(height * (MAX_WIDTH / width));
        width = MAX_WIDTH;
      }
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, width, height);
      currentImageData = canvas.toDataURL('image/jpeg', 0.6);
      
      document.getElementById('previewImage').src = currentImageData;
      document.getElementById('previewDate').innerText = getTodayString();
      
      switchInputMode('card');
      currentNoticeIndex = -1;

      stampImg.src = 'images/water_stamp.png'; 

      if (isPreviewWatered) {
        btn.className = "bg-gray-300 text-gray-500 rounded-[2rem] py-4 px-6 md:px-8 text-2xl md:text-3xl font-bold w-full max-w-md flex justify-center items-center gap-3 pointer-events-none";
        btn.innerHTML = "✨ みずやり できたよ";
        stampContainer.classList.remove('hidden');
      } else {
        btn.className = "btn-3d bg-blue-500 text-white rounded-[2rem] py-4 px-6 md:px-8 text-2xl md:text-3xl font-bold w-full max-w-md flex justify-center items-center gap-3 active:bg-blue-600";
        btn.innerHTML = "💧 みずを あげたよ！";
        stampContainer.classList.add('hidden');
      }
    }

    function saveRecord() {
      if (!currentImageData) return;

      let noticeHtmlForList = ''; 
      let noticeHtmlForPdf = ''; 

      if (currentInputMode === 'card') {
        if (currentNoticeIndex >= 0) {
          const opt = NOTICE_OPTIONS[currentYasai][currentNoticeIndex];
          noticeHtmlForList = `
            <div class="flex flex-col items-center">
              <img src="${opt.img}" class="w-20 h-20 md:w-24 md:h-24 mb-3 object-contain">
              <div class="font-bold text-2xl md:text-3xl mb-2">${opt.title}</div>
              <div class="text-xl md:text-2xl">${opt.text}</div>
            </div>
          `;
          noticeHtmlForPdf = `
            <div style="display:flex; flex-direction:column; align-items:center; text-align:center;">
              <img src="${opt.img}" style="height: 100px; object-fit: contain; margin-bottom: 15px;">
              <div style="font-weight:bold; font-size: 28px; margin-bottom: 10px;">${opt.title}</div>
              <div style="font-size: 24px;">${opt.text}</div>
            </div>
          `;
        } else {
          showError('いまの ようすの カードを<br>どれか えらんでね！');
          return;
        }
      } else {
        const text = document.getElementById('noticeText').value.trim();
        const safeText = text || '（かいてないよ）';
        noticeHtmlForList = `<div class="whitespace-pre-wrap">${safeText}</div>`;
        noticeHtmlForPdf = `<div style="white-space: pre-wrap;">${safeText}</div>`;
      }

      const today = getTodayKey();
      let wateringDays = JSON.parse(localStorage.getItem('watering_days')) || [];
      
      let isLevelUp = false;

      if (isPreviewWatered && !wateringDays.includes(today)) {
        wateringDays.push(today);
        localStorage.setItem('watering_days', JSON.stringify(wateringDays));
        
        const newCount = wateringDays.length;
        for (let i = 0; i < WATERING_TITLES.length; i++) {
          if (newCount === WATERING_TITLES[i].min && newCount > 0) {
            isLevelUp = true;
            break;
          }
        }
      }

      if (isLevelUp) {
        playSound('levelup'); 
      } else {
        playSound('success'); 
      }

      const record = {
        id: Date.now(),
        dateText: getTodayString(),
        image: currentImageData,
        noticeListHtml: noticeHtmlForList, 
        noticePdfHtml: noticeHtmlForPdf,   
        yasai: currentYasai,
        userName: currentUserName,
        watered: isPreviewWatered 
      };

      try {
        let records = JSON.parse(localStorage.getItem('yasai_records')) || [];
        records.push(record);
        localStorage.setItem('yasai_records', JSON.stringify(records));
        
        const modal = document.getElementById('modal-success');
        
        if (isLevelUp) {
          modal.innerHTML = `
            <div class="bg-white rounded-[3rem] p-10 md:p-12 flex flex-col items-center transform transition-transform animate-bounce border-8 border-yellow-400 max-w-lg w-full mx-4 text-center">
              <div class="text-8xl md:text-9xl mb-4 md:mb-6">👑</div>
              <div class="text-3xl md:text-4xl font-bold text-orange-500 mb-2">しょうごう が あがったよ！</div>
              <div class="text-2xl md:text-3xl text-gray-600">きろくも できたよ！</div>
            </div>
          `;
        } else {
          modal.innerHTML = `
            <div class="bg-white rounded-[3rem] p-10 md:p-12 flex flex-col items-center transform transition-transform animate-bounce max-w-sm w-full mx-4">
              <div class="text-8xl md:text-9xl mb-4 md:mb-6">💮</div>
              <div class="text-4xl md:text-5xl font-bold text-red-500">きろく したよ！</div>
            </div>
          `;
        }

        modal.classList.remove('hidden');
        
        setTimeout(() => {
          modal.classList.add('hidden');
          showView('home', false); 
          currentImageData = null;
        }, 2500);

      } catch (e) {
        if (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED') {
          showError('きろくが いっぱいです。<br>せんせいを よんでね。', true);
        } else {
          showError('きろくに しっぱいしたよ。<br>せんせいを よんでね。', false);
        }
      }
    }

    function getFormatDate(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}${m}${d}`;
    }

    function renderList() {
      const listContainer = document.getElementById('recordList');
      listContainer.innerHTML = '';
      let records = JSON.parse(localStorage.getItem('yasai_records')) || [];
      const currentData = YASAI_DATA[currentYasai];
      
      if (records.length === 0) {
        listContainer.innerHTML = `
          <div class="flex flex-col items-center justify-center h-full text-gray-500 mt-10 md:mt-20">
            <div class="w-32 h-32 md:w-40 md:h-40 mb-6"><img src="${currentData.img}" class="w-full h-full object-contain"></div>
            <div class="text-2xl md:text-3xl font-bold mb-4">まだ きろくが ないよ</div>
            <div class="text-xl md:text-2xl">しゃしんを とってみよう！</div>
          </div>
        `;
        return;
      }

      records.sort((a, b) => b.id - a.id);

      records.forEach((record) => {
        const item = document.createElement('div');
        item.className = 'snap-item bg-white p-4 md:p-6 shadow-2xl flex flex-col lg:flex-row border-4 border-theme-medium rounded-[2rem] w-full max-w-6xl mx-auto h-auto min-h-[70vh] shrink-0 gap-4 md:gap-6';
        
        const leftCol = document.createElement('div');
        leftCol.className = 'w-full lg:w-3/5 h-72 sm:h-96 lg:h-auto lg:min-h-[60vh] flex items-center justify-center bg-gray-100 border-4 border-gray-300 rounded-2xl overflow-hidden shrink-0 shadow-inner relative';
        const img = document.createElement('img');
        img.src = record.image;
        img.className = 'max-w-full max-h-full object-contain';
        leftCol.appendChild(img);

        const rightCol = document.createElement('div');
        rightCol.className = 'w-full lg:w-2/5 flex flex-col flex-1 gap-4 shrink-0';
        
        const dateDiv = document.createElement('div');
        dateDiv.className = 'w-full text-center pb-4 border-b-4 border-theme-main flex flex-col items-center shrink-0';
        
        const recordYasaiData = YASAI_DATA[record.yasai || currentYasai];
        const recordName = record.userName || currentUserName;
        
        const waterBadge = record.watered 
          ? `<div class="bg-blue-100 text-blue-700 text-lg md:text-xl px-4 md:px-6 py-2 rounded-full font-bold mt-2 inline-flex items-center gap-2 border-2 border-blue-300 shadow-sm"><img src="images/water_stamp.png" class="w-6 h-6 object-contain"> このひは みずやり したよ！</div>` 
          : `<div class="bg-gray-100 text-gray-500 text-base md:text-lg px-4 py-2 rounded-full font-bold mt-2 inline-block">みずやりの きろく なし</div>`;
        
        dateDiv.innerHTML = `
          <div class="text-lg md:text-xl text-gray-500 font-bold mb-1">${recordName}さんの</div>
          <div class="text-3xl md:text-4xl font-bold text-gray-800 flex justify-center items-center gap-3">
            <img src="${recordYasaiData.img}" class="w-10 h-10 md:w-12 md:h-12 object-contain">
            ${record.dateText}
          </div>
          <div>${waterBadge}</div>
        `;

        const pdfBtn = document.createElement('button');
        pdfBtn.className = 'teacher-pdf-btn hidden btn-3d bg-theme-btn text-white px-5 py-3 rounded-2xl text-lg font-bold flex items-center gap-2 mt-4 transition-colors shadow';
        pdfBtn.innerHTML = '🖨️ このきろくを PDF ほぞん';
        pdfBtn.onclick = () => downloadPDF(record.id);
        dateDiv.appendChild(pdfBtn);
        
        const noticeContainer = document.createElement('div');
        noticeContainer.className = 'w-full grow flex flex-col border-4 border-blue-200 rounded-2xl p-4 md:p-6 bg-blue-50 shadow-inner min-h-[150px] md:min-h-[250px]';
        const noticeLabel = document.createElement('div');
        noticeLabel.className = 'text-xl md:text-2xl font-bold text-blue-700 mb-2 md:mb-3 border-b-2 border-blue-200 pb-2 shrink-0';
        noticeLabel.innerHTML = '✏️ きづいたこと';
        
        const noticeText = document.createElement('div');
        noticeText.className = 'text-lg md:text-2xl text-gray-800 grow overflow-y-auto whitespace-pre-wrap leading-relaxed font-medium';
        noticeText.innerHTML = record.noticeListHtml || record.notice || '（かいてないよ）';
        
        noticeContainer.appendChild(noticeLabel);
        noticeContainer.appendChild(noticeText);

        rightCol.appendChild(dateDiv);
        rightCol.appendChild(noticeContainer);

        item.appendChild(leftCol);
        item.appendChild(rightCol);

        listContainer.appendChild(item);
      });

      updateTeacherModeUI();
    }

    function startSecretPress(e) {
      cancelSecretPress(); 
      secretPressTimer = setTimeout(() => {
        isTeacherMode = !isTeacherMode;
        updateTeacherModeUI();
        playSound('success'); 
      }, 3000); 
    }

    function cancelSecretPress(e) {
      clearTimeout(secretPressTimer);
    }

    function updateTeacherModeUI() {
      const batchBtn = document.getElementById('batchPdfBtn');
      const individualBtns = document.querySelectorAll('.teacher-pdf-btn');
      
      if (isTeacherMode) {
        batchBtn.classList.remove('hidden');
        individualBtns.forEach(btn => btn.classList.remove('hidden'));
      } else {
        batchBtn.classList.add('hidden');
        individualBtns.forEach(btn => btn.classList.add('hidden'));
      }
    }

    // ★ 先生用リセットメニューの関数
    function startResetPress(e) {
      cancelResetPress(); 
      resetPressTimer = setTimeout(() => {
        playSound('success'); 
        showResetConfirm();
      }, 3000); 
    }

    function cancelResetPress(e) {
      clearTimeout(resetPressTimer);
    }

    function showResetConfirm() {
      document.getElementById('modal-reset').classList.remove('hidden');
    }

    function closeResetConfirm() {
      playSound('click');
      document.getElementById('modal-reset').classList.add('hidden');
    }

    function goToSelectView() {
      playSound('click');
      localStorage.removeItem('user_name');
      localStorage.removeItem('yasai_type');
      location.reload();
    }

    function showConfirmFromMenu() {
      playSound('click');
      document.getElementById('modal-reset').classList.add('hidden');
      showConfirm(); 
    }

    function showError(msg, canClear = false) {
      playSound('click');
      document.getElementById('errorMsg').innerHTML = msg;
      document.getElementById('modal-error').classList.remove('hidden');
      if (canClear) document.getElementById('clearBtn').classList.remove('hidden');
      else document.getElementById('clearBtn').classList.add('hidden');
    }

    function showConfirm() {
      playSound('click');
      document.getElementById('modal-confirm').classList.remove('hidden');
    }

    function closeConfirm() {
      playSound('click');
      document.getElementById('modal-confirm').classList.add('hidden');
    }

    function executeClear() {
      playSound('click');
      localStorage.removeItem('yasai_records');
      localStorage.removeItem('yasai_type'); 
      localStorage.removeItem('user_name'); 
      localStorage.removeItem('watering_days');
      location.reload(); 
    }

    function downloadPDF(recordId = null) {
      playSound('click');
      let records = JSON.parse(localStorage.getItem('yasai_records')) || [];
      if (records.length === 0) {
        showError('きろくが まだ ないよ', false);
        return;
      }

      let targetRecords = records;
      let filename = '';
      const yasaiName = YASAI_DATA[currentYasai].name;

      if (recordId !== null) {
        targetRecords = records.filter(r => r.id === recordId);
        const recordDate = new Date(recordId);
        filename = `${yasaiName}のきろく_${getFormatDate(recordDate)}.pdf`;
      } else {
        filename = `${yasaiName}のきろく_ぜんぶ_${getFormatDate(new Date())}.pdf`;
      }

      document.getElementById('modal-error').classList.remove('hidden');
      document.getElementById('errorIcon').innerText = '⏳';
      document.getElementById('errorTitle').innerText = 'ちょっと まってね';
      document.getElementById('errorTitle').classList.replace('text-red-500', 'text-blue-500');
      document.getElementById('errorMsg').innerHTML = 'PDFを つくっています...<br>そのまま まってね';
      document.getElementById('errorButtons').classList.add('hidden');

      const pdfContainer = document.createElement('div');
      pdfContainer.style.width = '794px'; 
      pdfContainer.style.backgroundColor = 'white';
      pdfContainer.style.color = '#1f2937';

      const sortedRecords = [...targetRecords].sort((a, b) => a.id - b.id);

      sortedRecords.forEach((record, index) => {
        const page = document.createElement('div');
        page.style.width = '794px';
        page.style.height = '1123px'; 
        page.style.padding = '50px';
        page.style.boxSizing = 'border-box';
        page.style.display = 'flex';
        page.style.flexDirection = 'column';
        
        if (index !== sortedRecords.length - 1) page.style.pageBreakAfter = 'always';

        const recordYasaiData = YASAI_DATA[record.yasai || currentYasai];
        const pdfBorderColor = recordYasaiData.pdfColor;
        const recordName = record.userName || currentUserName;

        const waterText = record.watered 
          ? `<img src="images/water_stamp.png" style="height: 24px; vertical-align: middle; margin-right: 8px;"> このひは みずやり したよ！` 
          : '（みずやりの きろく なし）';
        const waterColor = record.watered ? '#1d4ed8' : '#9ca3af';
        const waterBg = record.watered ? '#dbeafe' : '#f3f4f6';
        const waterBorder = record.watered ? '2px solid #93c5fd' : 'none';

        page.innerHTML = `
          <div style="font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 10px; color: #6b7280; font-family: sans-serif;">
            ${recordName}さんの
          </div>
          <div style="font-size: 36px; font-weight: bold; text-align: center; margin-bottom: 15px; border-bottom: 4px solid ${pdfBorderColor}; padding-bottom: 10px; font-family: sans-serif; display: flex; justify-content: center; align-items: center; gap: 10px;">
            <img src="${recordYasaiData.img}" style="height: 40px; object-fit: contain;">
            ${record.dateText} の きろく
          </div>
          <div style="display: flex; justify-content: center; margin-bottom: 25px;">
            <div style="background-color: ${waterBg}; color: ${waterColor}; border: ${waterBorder}; font-size: 20px; font-weight: bold; padding: 10px 24px; border-radius: 99px; font-family: sans-serif;">
              ${waterText}
            </div>
          </div>
          <div style="width: 100%; height: 460px; display: flex; justify-content: center; align-items: center; background-color: #f9fafb; border: 4px solid #e5e7eb; border-radius: 16px; margin-bottom: 30px; overflow: hidden;">
            <img src="${record.image}" style="max-width: 100%; max-height: 100%; object-fit: contain;">
          </div>
          <div style="flex: 1; border: 4px solid #bfdbfe; border-radius: 16px; padding: 30px; background-color: #eff6ff; display: flex; flex-direction: column;">
            <div style="font-size: 24px; font-weight: bold; color: #1d4ed8; margin-bottom: 15px; font-family: sans-serif;">
              ✏️ きづいたこと
            </div>
            <div style="font-size: 24px; line-height: 1.6; font-family: sans-serif; flex: 1; font-weight: bold;">
              ${record.noticePdfHtml || record.notice || '（かいてないよ）'}
            </div>
          </div>
        `;
        pdfContainer.appendChild(page);
      });

      const opt = {
        margin:       0,
        filename:     filename, 
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'px', format: [794, 1123], orientation: 'portrait' }
      };

      setTimeout(() => {
        html2pdf().set(opt).from(pdfContainer).save().then(() => {
          resetErrorModal();
          playSound('success'); 
        }).catch(e => {
          resetErrorModal();
          showError('PDFが つくれなかったよ。<br>せんせいを よんでね。', false);
        });
      }, 500);
    }

    function resetErrorModal() {
      document.getElementById('modal-error').classList.add('hidden');
      document.getElementById('errorIcon').innerText = '⚠️';
      document.getElementById('errorTitle').innerText = 'おかしいな？';
      document.getElementById('errorTitle').classList.replace('text-blue-500', 'text-red-500');
      document.getElementById('errorButtons').classList.remove('hidden');
    }
  </script>
</body>
</html>
